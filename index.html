<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>淡紫記帳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --purple: #C38ED5;
  --purple-dark: #9B59B6;
  --purple-light: #F3E5F5;
  --bg: #FDF9FF;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body, html { 
    height: 100%; width: 100%; 
    background: var(--bg); 
    font-family: 'Noto Sans TC', sans-serif;
    color: #4A4A4A; overflow: hidden;
}

#app { 
    height: 100vh; display: flex; flex-direction: column; 
    position: relative; overflow: hidden;
}

/* --- 頂部裝飾 --- */
.header-visual {
    background: linear-gradient(180deg, var(--purple) 0%, #D7A8E8 100%);
    height: calc(180px + var(--safe-top));
    padding-top: var(--safe-top);
    border-radius: 0 0 45px 45px;
    position: absolute; top: 0; width: 100%; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
}
.header-title { color: white; font-weight: 700; font-size: 18px; margin-top: 15px; }

/* --- 懸浮統計卡片 --- */
.summary-card {
    background: white; border-radius: 28px; padding: 22px;
    margin: calc(85px + var(--safe-top)) 18px 0;
    box-shadow: 0 12px 35px rgba(195,142,213,0.18);
    position: relative; z-index: 2;
    display: flex; justify-content: space-around; text-align: center;
}
.summary-item .label { font-size: 11px; color: #BBB; margin-bottom: 4px; }
.summary-item .val { font-size: 18px; font-weight: 700; color: var(--purple); }

/* --- 內容區域 --- */
.content-area { 
    flex: 1; overflow-y: auto; 
    padding: 20px 18px 120px; 
    position: relative; z-index: 2;
}
.screen { display: none; }
.screen.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* --- 列表樣式 --- */
.tx-group { margin-bottom: 20px; }
.tx-date { font-size: 12px; color: #BBB; margin-left: 8px; margin-bottom: 8px; }
.tx-item {
    background: white; border-radius: 20px; padding: 14px 18px;
    display: flex; align-items: center; margin-bottom: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.02);
}
.tx-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--purple-light); display: flex; align-items: center; justify-content: center; font-size: 22px; margin-right: 12px; }
.tx-main { flex: 1; }
.tx-name { font-size: 15px; font-weight: 600; }
.tx-amount { font-weight: 700; font-size: 16px; }

/* --- 底部導航 --- */
.bottom-nav {
    position: fixed; bottom: 0; width: 100%;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    border-top: 1px solid #F0F0F0;
    padding-bottom: var(--safe-bottom);
    display: flex; justify-content: space-around; z-index: 100;
}
.nav-item { padding: 12px 0; text-align: center; color: #CCC; flex: 1; transition: 0.3s; }
.nav-item.active { color: var(--purple); }
.nav-icon { font-size: 22px; display: block; }
.nav-text { font-size: 10px; font-weight: bold; margin-top: 4px; }

/* --- 圓形按鈕 --- */
.fab {
    position: fixed; bottom: calc(85px + var(--safe-bottom)); right: 20px;
    width: 60px; height: 60px; background: var(--purple);
    border-radius: 30px; display: flex; align-items: center; justify-content: center;
    color: white; font-size: 32px; box-shadow: 0 10px 25px rgba(195,142,213,0.4);
    z-index: 99; border: none;
}

/* --- 彈窗 & 鍵盤 --- */
.modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3);
    z-index: 200; display: none; align-items: flex-end;
}
.modal.open { display: flex; }
.modal-sheet {
    background: white; width: 100%; border-radius: 32px 32px 0 0;
    padding-bottom: var(--safe-bottom); animation: slideUp 0.3s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px 20px 20px; background: #F9F9F9; }
.num-btn { background: white; border: none; height: 54px; border-radius: 16px; font-size: 20px; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.num-btn:active { background: #EEE; }
.btn-purple { background: var(--purple); color: white; }
</style>
</head>
<body>

<div id="app">
    <!-- 頂部裝飾 -->
    <div class="header-visual">
        <div class="header-title">💜 我的記帳本</div>
    </div>

    <!-- 統計卡片 -->
    <div class="summary-card">
        <div class="summary-item"><div class="label">總額</div><div class="val" id="sum-total">$0</div></div>
        <div class="summary-item"><div class="label">收入</div><div class="val" id="sum-income" style="color:#4ECB71;">$0</div></div>
        <div class="summary-item"><div class="label">支出</div><div class="val" id="sum-expense" style="color:#FF6B6B;">$0</div></div>
    </div>

    <!-- 內容滾動區 -->
    <div class="content-area">
        <div class="screen active" id="screen-home">
            <div id="tx-list"></div>
        </div>
        
        <div class="screen" id="screen-chart">
            <div style="background:white; border-radius:25px; padding:20px; box-shadow:0 10px 25px rgba(0,0,0,0.05);">
                <canvas id="chart-canvas"></canvas>
            </div>
            <div id="chart-list" style="margin-top:20px;"></div>
        </div>

        <div class="screen" id="screen-cal">
            <div id="cal-view" style="background:white; border-radius:25px; padding:15px; box-shadow:0 10px 25px rgba(0,0,0,0.05); text-align:center;">
                日曆功能加載中...
            </div>
        </div>
    </div>

    <!-- 底部導航 -->
    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
            <span class="nav-icon">📒</span><span class="nav-text">記帳本</span>
        </div>
        <div class="nav-item" id="nav-chart" onclick="switchTab('chart')">
            <span class="nav-icon">📊</span><span class="nav-text">圖表分析</span>
        </div>
        <div class="nav-item" id="nav-cal" onclick="switchTab('cal')">
            <span class="nav-icon">📅</span><span class="nav-text">日曆</span>
        </div>
    </nav>

    <button class="fab" onclick="openModal()">+</button>
</div>

<!-- 記帳彈窗 -->
<div class="modal" id="add-modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-sheet">
        <div style="padding:15px; text-align:center; font-weight:700; color:var(--purple); border-bottom:1px solid #F0F0F0;">新增一筆</div>
        <div id="display-amount" style="text-align:center; font-size:48px; padding:25px; color:var(--purple); font-weight:300;">0</div>
        
        <div class="numpad">
            <button class="num-btn" onclick="pressNum('7')">7</button>
            <button class="num-btn" onclick="pressNum('8')">8</button>
            <button class="num-btn" onclick="pressNum('9')">9</button>
            <button class="num-btn btn-purple" onclick="pressDelete()">⌫</button>
            <button class="num-btn" onclick="pressNum('4')">4</button>
            <button class="num-btn" onclick="pressNum('5')">5</button>
            <button class="num-btn" onclick="pressNum('6')">6</button>
            <button class="num-btn btn-purple" onclick="pressNum('+')">+</button>
            <button class="num-btn" onclick="pressNum('1')">1</button>
            <button class="num-btn" onclick="pressNum('2')">2</button>
            <button class="num-btn" onclick="pressNum('3')">3</button>
            <button class="num-btn btn-purple" style="grid-row:span 2; height:118px;" onclick="save()">OK</button>
            <button class="num-btn" onclick="pressNum('0')" style="grid-column:span 2;">0</button>
            <button class="num-btn" onclick="pressNum('.')">.</button>
        </div>
    </div>
</div>

<script>
let records = JSON.parse(localStorage.getItem('lzb_v2') || '[]');
let amountStr = "";
let donutChart = null;

function switchTab(id) {
    // 1. 隱藏所有螢幕
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    // 2. 取消所有導航高亮
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    // 3. 顯示選定螢幕 (確保 ID 存在)
    const targetScreen = document.getElementById('screen-' + id);
    const targetNav = document.getElementById('nav-' + id);
    
    if (targetScreen) targetScreen.classList.add('active');
    if (targetNav) targetNav.classList.add('active');

    if (id === 'chart') renderChart();
}

function openModal() { document.getElementById('add-modal').classList.add('open'); }
function closeModal() { document.getElementById('add-modal').classList.remove('open'); }

function pressNum(v) {
    amountStr += v;
    document.getElementById('display-amount').innerText = amountStr;
}

function pressDelete() {
    amountStr = amountStr.slice(0, -1);
    document.getElementById('display-amount').innerText = amountStr || "0";
}

function save() {
    if(!amountStr) return;
    try {
        let finalAmt = eval(amountStr); // 處理運算
        records.push({
            id: Date.now(),
            amount: parseFloat(finalAmt),
            date: new Date().toISOString().slice(5, 10).replace('-', '/'),
            type: 'expense'
        });
        localStorage.setItem('lzb_v2', JSON.stringify(records));
        amountStr = "";
        document.getElementById('display-amount').innerText = "0";
        closeModal();
        renderHome();
    } catch(e) { alert('輸入錯誤'); amountStr = ""; }
}

function renderHome() {
    const list = document.getElementById('tx-list');
    const income = records.filter(r => r.type === 'income').reduce((a, b) => a + b.amount, 0);
    const expense = records.filter(r => r.type === 'expense').reduce((a, b) => a + b.amount, 0);
    
    document.getElementById('sum-income').innerText = '$' + income;
    document.getElementById('sum-expense').innerText = '$' + expense;
    document.getElementById('sum-total').innerText = '$' + (income - expense);

    list.innerHTML = records.slice().reverse().map(r => `
        <div class="tx-item">
            <div class="tx-icon">🍱</div>
            <div class="tx-main">
                <div class="tx-name">餐飲</div>
                <div style="font-size:11px; color:#BBB;">${r.date}</div>
            </div>
            <div class="tx-amount" style="color:#FF6B6B;">-$${r.amount}</div>
        </div>
    `).join('');
}

function renderChart() {
    const ctx = document.getElementById('chart-canvas');
    if(donutChart) donutChart.destroy();
    const data = records.length ? records.map(r => r.amount) : [1];
    donutChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            datasets: [{
                data: data,
                backgroundColor: ['#C38ED5', '#D7A8E8', '#F3E5F5', '#E0D0EC'],
                borderWidth: 0
            }]
        },
        options: { cutout: '75%' }
    });
}

// 初始化
renderHome();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>淡紫記帳 Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --purple: #C38ED5;
  --purple-dark: #9B59B6;
  --purple-light: #F3E5F5;
  --bg: #FDF9FF;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { height: 100%; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: #4A4A4A; }
#app { height: 100dvh; display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; position: relative; overflow: hidden; }

/* ── 佈局 ── */
.screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.screen.active { display: flex; }
.scroll-area { flex: 1; overflow-y: auto; padding: 10px 18px 120px; -webkit-overflow-scrolling: touch; }

/* ── 頂部背景 ── */
.header-bg {
  background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
  color: white; padding: calc(15px + var(--safe-top)) 20px 35px;
  border-radius: 0 0 40px 40px; box-shadow: 0 5px 20px rgba(155,89,182,0.2);
  flex-shrink: 0; text-align: center;
}

/* ── 預算卡片 ── */
.budget-card {
  background: white; border-radius: 25px; padding: 20px;
  margin: -30px 20px 15px; box-shadow: 0 10px 30px rgba(195,142,213,0.15);
}
.progress-container { height: 8px; background: #EEE; border-radius: 4px; margin: 12px 0; overflow: hidden; }
.progress-fill { height: 100%; background: var(--purple); border-radius: 4px; transition: width 0.5s ease; }

/* ── 列表樣式 ── */
.date-group { margin-bottom: 20px; }
.date-label { font-size: 12px; color: #BBB; margin: 0 0 8px 10px; font-weight: 600; }
.tx-item {
  background: white; border-radius: 20px; padding: 14px 18px;
  display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.02);
}
.tx-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--purple-light); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.tx-info { flex: 1; }
.tx-name { font-size: 15px; font-weight: 600; }
.tx-note { font-size: 11px; color: #BBB; }
.tx-amount { font-weight: 700; font-size: 16px; text-align: right; }
.expense { color: #FF6B6B; }
.income { color: #4ECB71; }

/* ── 底部導航 ── */
.bottom-nav {
  position: fixed; bottom: 0; width: 100%; max-width: 430px;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
  display: flex; padding-bottom: var(--safe-bottom); border-top: 1px solid #EEE; z-index: 100;
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 0; color: #CCC; font-size: 10px; font-weight: bold; }
.nav-item.active { color: var(--purple); }

/* ── 懸浮按鈕 ── */
.fab {
  position: fixed; bottom: calc(85px + var(--safe-bottom)); right: 20px;
  width: 60px; height: 60px; background: var(--purple); color: white; font-size: 32px; border: none;
  box-shadow: 0 10px 25px rgba(195,142,213,0.4); z-index: 90; border-radius: 30px;
}

/* ── 彈窗 ── */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: flex-end; }
.modal.open { display: flex; }
.modal-sheet { background: white; width: 100%; border-radius: 35px 35px 0 0; padding-bottom: var(--safe-bottom); animation: slideUp 0.3s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* ── 分類網格 ── */
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 15px 20px; max-height: 200px; overflow-y: auto; }
.cat-item { display: flex; flex-direction: column; align-items: center; gap: 5px; opacity: 0.4; transition: 0.2s; }
.cat-item.active { opacity: 1; transform: scale(1.1); }
.cat-btn { width: 45px; height: 45px; border-radius: 15px; background: #F8F8F8; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.cat-text { font-size: 11px; font-weight: 600; }

/* ── 鍵盤 ── */
.numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; background: #F8F8F8; }
.num-btn { background: white; border: none; height: 50px; border-radius: 12px; font-size: 18px; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.num-btn:active { background: #EEE; }
.btn-save { background: var(--purple); color: white; grid-row: span 2; height: 108px; }

/* ── 分析圖表 ── */
.chart-box { background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.03); }
</style>
</head>
<body>

<div id="app">
  <!-- ════════ 首頁 ════════ -->
  <div class="screen active" id="screen-home">
    <div class="header-bg">
      <div style="font-size:18px; font-weight:700; margin-bottom:15px;">💜 默認帳本</div>
      <div style="display:flex; justify-content: space-around; align-items:center;">
        <div><div style="font-size:11px; opacity:0.8;">本月收入</div><div id="sum-income" style="font-size:18px; font-weight:700;">$0</div></div>
        <div><div style="font-size:11px; opacity:0.8;">本月支出</div><div id="sum-expense" style="font-size:18px; font-weight:700;">$0</div></div>
      </div>
    </div>
    
    <div class="budget-card">
      <div style="display:flex; justify-content: space-between; font-size:13px; font-weight:700;">
        <span>📅 月預算進度</span>
        <span id="budget-percent" style="color:var(--purple);">0%</span>
      </div>
      <div class="progress-container"><div id="budget-fill" class="progress-fill" style="width: 0%"></div></div>
      <div id="budget-text" style="font-size:11px; color:#BBB;">剩餘預算加載中...</div>
    </div>

    <div class="scroll-area" id="home-list">
        <!-- 近期紀錄 -->
    </div>
  </div>

  <!-- ════════ 分析 ════════ -->
  <div class="screen" id="screen-chart">
    <div class="header-bg" style="height:120px;">
        <div style="font-size:18px; font-weight:700; padding-top:10px;">圖表分析</div>
    </div>
    <div class="scroll-area">
        <div class="chart-box">
            <div style="font-size:14px; font-weight:700; margin-bottom:15px;">🛒 支出佔比</div>
            <canvas id="donut-canvas"></canvas>
        </div>
        <div id="ranking-list" style="margin-bottom:20px;"></div>
        <div class="chart-box">
            <div style="font-size:14px; font-weight:700; margin-bottom:15px;">📈 資產趨勢</div>
            <canvas id="trend-canvas"></canvas>
        </div>
    </div>
  </div>

  <!-- ════════ 日曆 ════════ -->
  <div class="screen" id="screen-cal">
    <div class="header-bg" style="height:120px;">
        <div style="font-size:18px; font-weight:700; padding-top:10px;">日曆追蹤</div>
    </div>
    <div class="scroll-area" id="cal-view">
        <!-- 日曆由 JS 注入 -->
    </div>
  </div>

  <!-- ════════ 導航 ════════ -->
  <nav class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="switchScreen('home')"><span>📒</span>記帳本</div>
    <div class="nav-item" id="nav-chart" onclick="switchScreen('chart')"><span>🥧</span>分析</div>
    <div class="nav-item" id="nav-cal" onclick="switchScreen('cal')"><span>📅</span>日曆</div>
  </nav>

  <button class="fab" onclick="openModal()">+</button>
</div>

<!-- ════════ 記帳彈窗 ════════ -->
<div class="modal" id="add-modal" onclick="if(event.target==this) closeModal()">
  <div class="modal-sheet">
    <div style="padding:15px 20px; display:flex; justify-content:space-between; align-items:center;">
        <button onclick="closeModal()" style="border:none; background:none; color:#CCC; font-size:20px;">✕</button>
        <div style="display:flex; background:#F0F0F0; border-radius:10px; padding:3px;">
            <button id="acc-cash" onclick="setAccount('現金')" style="padding:5px 15px; border:none; border-radius:8px; font-size:12px; font-weight:bold;">現金</button>
            <button id="acc-card" onclick="setAccount('信用卡')" style="padding:5px 15px; border:none; border-radius:8px; font-size:12px; font-weight:bold; background:none; color:#AAA;">信用卡</button>
        </div>
        <span style="width:20px;"></span>
    </div>

    <!-- 標題與日期 -->
    <div style="padding:0 20px 10px; display:flex; gap:10px;">
        <input id="note-input" type="text" placeholder="📝 輸入備註..." style="flex:1; border:none; background:#F8F8F8; padding:10px; border-radius:12px; font-size:14px; outline:none;">
        <input id="date-input" type="date" style="border:none; background:#F8F8F8; padding:10px; border-radius:12px; font-size:12px; outline:none;">
    </div>

    <div id="display-amount" style="text-align:center; font-size:48px; padding:10px; color:var(--purple); font-weight:300;">0</div>
    
    <div class="cat-grid" id="cat-grid"></div>

    <div class="numpad">
        <button class="num-btn" onclick="pressKey('7')">7</button>
        <button class="num-btn" onclick="pressKey('8')">8</button>
        <button class="num-btn" onclick="pressKey('9')">9</button>
        <button class="num-btn" onclick="pressKey('delete')" style="color:var(--purple);">⌫</button>
        <button class="num-btn" onclick="pressKey('4')">4</button>
        <button class="num-btn" onclick="pressKey('5')">5</button>
        <button class="num-btn" onclick="pressKey('6')">6</button>
        <button class="num-btn" onclick="pressKey('+')" style="color:var(--purple);">+</button>
        <button class="num-btn" onclick="pressKey('1')">1</button>
        <button class="num-btn" onclick="pressKey('2')">2</button>
        <button class="num-btn" onclick="pressKey('3')">3</button>
        <button class="num-btn btn-save" onclick="saveRecord()">OK</button>
        <button class="num-btn" onclick="pressKey('0')" style="grid-column: span 2;">0</button>
        <button class="num-btn" onclick="pressKey('.')">.</button>
    </div>
  </div>
</div>

<script>
// --- 設定與資料 ---
const MONTHLY_BUDGET = 20000;
const CATEGORIES = [
    {id:'food', name:'飲食', icon:'🍔'}, {id:'bus', name:'交通', icon:'🚌'},
    {id:'shop', name:'購物', icon:'🛍️'}, {id:'home', name:'日用', icon:'🏠'},
    {id:'play', name:'娛樂', icon:'🎮'}, {id:'med', name:'醫療', icon:'🏥'},
    {id:'social', name:'社交', icon:'🥂'}, {id:'gift', name:'禮物', icon:'🎁'},
    {id:'phone', name:'通訊', icon:'📱'}, {id:'cloth', name:'服飾', icon:'👗'},
    {id:'tax', name:'稅金', icon:'💵'}, {id:'other', name:'其他', icon:'💰'}
];

let records = JSON.parse(localStorage.getItem('lzb_pro_v1') || '[]');
let amountStr = "";
let selectedCat = 'food';
let selectedAccount = '現金';
let donutChart = null, trendChart = null;

function saveData() { localStorage.setItem('lzb_pro_v1', JSON.stringify(records)); }
function fmt(n) { return '$' + Math.abs(n).toLocaleString('en'); }

// --- 介面控制 ---
function switchScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + id).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('nav-' + id).classList.add('active');
    
    if(id === 'home') renderHome();
    if(id === 'chart') renderAnalysis();
    if(id === 'cal') renderCalendar();
}

function openModal() {
    document.getElementById('add-modal').classList.add('open');
    document.getElementById('date-input').value = new Date().toISOString().slice(0,10);
    renderCatGrid();
}
function closeModal() { document.getElementById('add-modal').classList.remove('open'); amountStr = ""; updateDisplay(); }

function renderCatGrid() {
    const grid = document.getElementById('cat-grid');
    grid.innerHTML = CATEGORIES.map(c => `
        <div class="cat-item ${selectedCat===c.id?'active':''}" onclick="selectedCat='${c.id}'; renderCatGrid();">
            <div class="cat-btn">${c.icon}</div>
            <div class="cat-text">${c.name}</div>
        </div>
    `).join('');
}

function setAccount(acc) {
    selectedAccount = acc;
    document.getElementById('acc-cash').style.background = acc==='現金'?'white':'none';
    document.getElementById('acc-cash').style.color = acc==='現金'?'black':'#AAA';
    document.getElementById('acc-card').style.background = acc==='信用卡'?'white':'none';
    document.getElementById('acc-card').style.color = acc==='信用卡'?'black':'#AAA';
}

function pressKey(v) {
    if(v === 'delete') amountStr = amountStr.slice(0,-1);
    else amountStr += v;
    updateDisplay();
}
function updateDisplay() { document.getElementById('display-amount').innerText = amountStr || "0"; }

// --- 核心運作 ---
function saveRecord() {
    if(!amountStr) return;
    try {
        let amt = eval(amountStr);
        records.push({
            id: Date.now(),
            amount: parseFloat(amt),
            cat: selectedCat,
            account: selectedAccount,
            note: document.getElementById('note-input').value || CATEGORIES.find(c=>c.id===selectedCat).name,
            date: document.getElementById('date-input').value,
            type: 'expense'
        });
        saveData();
        closeModal();
        renderHome();
    } catch(e) { alert('運算錯誤'); amountStr = ""; updateDisplay(); }
}

function renderHome() {
    const recs = records.sort((a,b) => b.date.localeCompare(a.date));
    const expense = recs.reduce((a,b) => a + b.amount, 0);
    
    // 更新預算
    const percent = Math.min(Math.round((expense/MONTHLY_BUDGET)*100), 100);
    document.getElementById('budget-fill').style.width = percent + '%';
    document.getElementById('budget-percent').innerText = percent + '%';
    document.getElementById('budget-text').innerText = `本月預算 $${MONTHLY_BUDGET}，剩餘 $${MONTHLY_BUDGET - expense}`;
    document.getElementById('sum-expense').innerText = fmt(expense);

    const list = document.getElementById('home-list');
    list.innerHTML = `<div style="font-weight:bold; margin-bottom:15px;">📋 近期記錄</div>`;
    
    // 日期分組
    const groups = {};
    recs.slice(0, 20).forEach(r => { groups[r.date] = groups[r.date] || []; groups[r.date].push(r); });
    
    Object.keys(groups).forEach(date => {
        let html = `<div class="date-group"><div class="date-label">${date}</div>`;
        groups[date].forEach(r => {
            const cat = CATEGORIES.find(c => c.id === r.cat);
            html += `
                <div class="tx-item">
                    <div class="tx-icon">${cat.icon}</div>
                    <div class="tx-info">
                        <div class="tx-name">${r.note}</div>
                        <div style="font-size:11px; color:#BBB;">${r.account}</div>
                    </div>
                    <div class="tx-amount expense">-${fmt(r.amount)}</div>
                </div>`;
        });
        list.innerHTML += html + `</div>`;
    });
}

function renderAnalysis() {
    const recs = records;
    const catData = {};
    CATEGORIES.forEach(c => catData[c.id] = 0);
    recs.forEach(r => catData[r.cat] += r.amount);

    // 圓環圖
    const ctxD = document.getElementById('donut-canvas');
    if(donutChart) donutChart.destroy();
    donutChart = new Chart(ctxD, {
        type: 'doughnut',
        data: {
            labels: CATEGORIES.map(c => c.name),
            datasets: [{
                data: CATEGORIES.map(c => catData[c.id]),
                backgroundColor: ['#C38ED5', '#9B59B6', '#D7A8E8', '#F3E5F5', '#E0D0EC', '#A5D6A7', '#81C784', '#FFF176', '#FFD54F', '#FF8A65', '#BA68C8', '#90A4AE'],
                borderWidth: 0
            }]
        },
        options: { cutout: '70%', plugins: { legend: { display: false } } }
    });

    // 排行榜
    const total = Object.values(catData).reduce((a,b)=>a+b, 0);
    const sorted = CATEGORIES.map(c => ({...c, val: catData[c.id]}))
                   .filter(c => c.val > 0)
                   .sort((a,b) => b.val - a.val);
    
    document.getElementById('ranking-list').innerHTML = sorted.map(c => `
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
            <span style="font-size:18px;">${c.icon}</span>
            <div style="flex:1;">
                <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
                    <span>${c.name} (${Math.round(c.val/total*100)}%)</span>
                    <span>${fmt(c.val)}</span>
                </div>
                <div style="height:4px; background:#EEE; border-radius:2px;">
                    <div style="height:100%; width:${c.val/total*100}%; background:var(--purple); border-radius:2px;"></div>
                </div>
            </div>
        </div>
    `).join('');

    // 資產趨勢 (簡單淨值變化)
    const trendCtx = document.getElementById('trend-canvas');
    if(trendChart) trendChart.destroy();
    
    const dateMap = {};
    recs.forEach(r => { dateMap[r.date] = (dateMap[r.date] || 0) + r.amount; });
    const sortedDates = Object.keys(dateMap).sort();
    let cumulative = 0;
    const trendData = sortedDates.map(d => { cumulative += dateMap[d]; return cumulative; });

    trendChart = new Chart(trendCtx, {
        type: 'line',
        data: {
            labels: sortedDates.map(d => d.slice(5)),
            datasets: [{ label: '累計支出', data: trendData, borderColor: '#C38ED5', tension: 0.4, fill: false }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });
}

function renderCalendar() {
    const container = document.getElementById('cal-view');
    const today = new Date().toISOString().slice(0,7);
    const [y, m] = today.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const firstDay = new Date(y, m-1, 1).getDay();
    
    let html = `<div style="font-weight:bold; margin-bottom:15px;">${y}年 ${m}月</div>`;
    html += `<div style="display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; font-weight:bold; color:#BBB; margin-bottom:10px;">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>`;
    
    for(let i=0; i<firstDay; i++) html += `<div></div>`;
    for(let d=1; d<=daysInMonth; d++) {
        const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayRecs = records.filter(r => r.date === dateStr);
        const daySum = dayRecs.reduce((a,b) => a + b.amount, 0);
        
        html += `
            <div style="padding:10px 0; border-radius:12px; position:relative;">
                <div style="font-size:14px; font-weight:500;">${d}</div>
                ${daySum > 0 ? `<div style="font-size:8px; color:#FF6B6B;">-${Math.round(daySum)}</div>` : ''}
            </div>`;
    }
    container.innerHTML = html + `</div>`;
}

// 初始化
renderHome();
</script>
</body>
</html>

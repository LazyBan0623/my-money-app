<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- iOS PWA 全螢幕關鍵設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="知恩手帳">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/536/536060.png">
<link rel="manifest" href="manifest.json">

<title>知恩手帳 Pro</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --theme: #c38ed5;
  --theme-dark: #a879b9;
  --theme-light: rgba(195, 142, 213, 0.15);
  --bg: #F9F9FB;
  --text: #444;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}

/* 修正：確保 body 背景與 App 底色一致，消除空白感 */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { 
    height: 100%; width: 100%; 
    background-color: var(--bg); /* 關鍵：設定背景色 */
    font-family: 'M PLUS Rounded 1c', sans-serif; 
    color: var(--text); overflow: hidden; 
}
#app { height: 100dvh; display: flex; flex-direction: column; position: relative; background-color: var(--bg); }

.num-font { font-family: 'Manrope', sans-serif; font-weight: 800; }

/* Header 佈局校正 */
.header-bg {
  background: linear-gradient(135deg, var(--theme) 0%, var(--theme-dark) 100%);
  color: white; padding: calc(12px + var(--safe-top)) 20px 30px;
  border-radius: 0 0 40px 40px; flex-shrink: 0; z-index: 10;
}
.h-row-1 { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; opacity: 0.9; }
.h-row-2 { margin: 15px 0 20px; text-align: center; width: 100%; }
.h-name { font-size: 22px; font-weight: 800; letter-spacing: 1px; line-height: 1.2; }
.h-desc { font-size: 10px; opacity: 0.8; margin-top: 4px; font-weight: 700; }

/* 存款大卡片 */
.balance-card { background: white; border-radius: 28px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: center; }
.piggy-wrap { width: 40px; height: 40px; border-radius: 50%; background: var(--theme-light); color: var(--theme); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; border: 2px solid white; }

/* 螢幕設定 */
.screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.screen.active { display: flex; }
.scroll-area { flex: 1; overflow-y: auto; padding: 15px 18px 140px; -webkit-overflow-scrolling: touch; }
.card-v { background: white; border-radius: 22px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); margin-bottom: 12px; }

/* 底部導航：修正底部空白，讓背景延伸到底部 */
.bottom-nav { 
    position: fixed; bottom: 0; width: 100%; max-width: 430px; 
    background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); 
    display: flex; 
    padding-bottom: var(--safe-bottom); /* 自動適應 iPhone 底部高度 */
    border-top: 1px solid #EEE; z-index: 100; 
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 0 8px; color: #CCC; font-size: 10px; font-weight: 800; }
.nav-item.active { color: var(--theme); }
.fab { position: fixed; bottom: calc(85px + var(--safe-bottom)); right: 20px; width: 62px; height: 62px; background: var(--theme); color: white; border-radius: 31px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 90; display: flex; align-items: center; justify-content: center; }

/* 彈窗與其它樣式維持 v22 邏輯 */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: flex-end; }
.modal-overlay.open { display: flex; }
.modal-sheet { background: white; width: 100%; border-radius: 30px 30px 0 0; padding-bottom: var(--safe-bottom); height: 94vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-header { height: 55px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #F5F5F5; flex-shrink: 0; position: relative; }
.close-btn { position: absolute; right: 18px; top: 15px; color: #DDD; border: none; background: none; }
.del-btn { position: absolute; left: 18px; top: 15px; color: #FF6B6B; font-weight: 800; border: none; background: none; }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 10px 20px; }
.cat-sq { width: 54px; height: 54px; border-radius: 16px; background: var(--theme); color: white; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.k-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 15px 15px; background: #F8F8F8; }
.k-btn { background: white; border: none; height: 50px; border-radius: 12px; font-size: 20px; font-weight: 800; color: #444; }
.k-ok { background: var(--theme); color: white; grid-row: span 2; height: 108px; border-radius: 12px; border: none; font-weight: 800; }
</style>
</head>
<body>

<div id="app">
  <!-- ════════ 1. 首頁 ════════ -->
  <div class="screen active" id="pg-home">
    <div class="header-bg">
        <div class="h-row-1">
            <span id="h-date-str">2026/06/04 THU</span>
            <i data-lucide="banknote" style="width:20px;"></i>
        </div>
        <div class="h-row-2">
            <div class="h-name"><span id="h-name-disp">知恩</span>手帳</div>
            <div class="h-desc" id="h-desc-disp">財富自由，指日可待</div>
        </div>
        <div class="balance-card">
            <div class="piggy-wrap"><i data-lucide="piggy-bank" style="width:24px; height:24px;"></i></div>
            <div style="font-size:12px; color:#999; font-weight:800; margin-bottom:2px;">當前存款總額</div>
            <div style="font-size:32px; color:var(--theme);" class="num-font" id="h-balance">$0</div>
        </div>
    </div>
    <div class="scroll-area">
        <div class="card-v" style="text-align:center;">
            <div style="font-size:13px; font-weight:800; color:#888;">本月結餘進度</div>
            <div class="prog-bg"><div id="h-budget-fill" class="prog-fill"></div></div>
            <div id="h-budget-text" style="font-size:11px; color:#999; font-weight:800;">載入中...</div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:15px;">
            <div class="card-v" style="margin:0; text-align:center;"><div style="font-size:11px; color:#999; font-weight:800;">現金支出</div><div style="font-size:18px; color:#ff6b6b;" class="num-font" id="h-cash">$0</div></div>
            <div class="card-v" style="margin:0; text-align:center;"><div style="font-size:11px; color:#999; font-weight:800;">信用支出</div><div style="font-size:18px; color:#ff6b6b;" class="num-font" id="h-card">$0</div></div>
        </div>
        <div id="h-list"></div>
    </div>
  </div>

  <!-- 其它頁面維持 v22 結構 (History, Analysis, Settings) -->
  <div class="screen" id="pg-history">
    <div class="header-bg"><div style="display:flex; justify-content:space-between; align-items:center;"><button onclick="changeHM(-1)" style="background:none; border:none; color:white;"><i data-lucide="chevron-left"></i></button><div id="hist-m-label" style="font-size:18px; font-weight:800;">2025年 6月</div><button onclick="changeHM(1)" style="background:none; border:none; color:white;"><i data-lucide="chevron-right"></i></button></div></div>
    <div class="scroll-area"><div class="card-v"><div style="display:flex; justify-content:space-between; font-size:12px; font-weight:800; margin-bottom:5px;"><span>本月結餘</span><span id="hist-net-val">$0</span></div><div class="prog-bg"><div id="hist-net-fill" class="prog-fill"></div></div><div id="hist-cal-box" style="margin-top:10px;"></div></div><div id="hist-list"></div></div>
  </div>

  <div class="screen" id="pg-chart">
    <div class="header-bg" style="height:70px; padding-top:15px; text-align:center;"><span style="font-weight:800;">數據分析</span></div>
    <div class="scroll-area"><div id="c-year-sel" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:12px;"></div><div id="c-annual-net" class="card-v" style="background:var(--theme); color:white; text-align:center; font-weight:800; font-size:16px;">年度總結餘: $0</div><div class="card-v" style="text-align:center; position:relative;"><div style="position:relative; height:180px; display:flex; justify-content:center; align-items:center;"><canvas id="chart-pie"></canvas><div style="position:absolute; text-align:center; pointer-events:none; top:50%; transform:translateY(-50%);"><div id="c-pie-m" style="font-size:22px; font-weight:800; color:var(--theme);">6月</div><div style="font-size:10px; color:#BBB; font-weight:700;">支出</div></div></div><div id="c-total-v" class="num-font" style="margin-top:15px; font-size:20px; color:var(--text);">$0</div></div><div id="c-rank"></div><div class="card-v" style="height:220px;"><canvas id="chart-trend"></canvas></div><div id="c-monthly-list"></div></div>
  </div>

  <div class="screen" id="pg-settings">
    <div class="header-bg" style="height:70px; padding-top:15px; text-align:center;"><span style="font-weight:800;">設定</span></div>
    <div class="scroll-area"><div class="card-v"><div style="font-weight:800; font-size:13px; margin-bottom:15px; color:var(--theme);">風格與存款設定</div><div style="display:flex; gap:12px; margin-bottom:20px; justify-content:center;"><div onclick="setTheme('#c38ed5')" style="width:34px;height:34px;border-radius:50%;background:#c38ed5;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);"></div><div onclick="setTheme('#74b9ff')" style="width:34px;height:34px;border-radius:50%;background:#74b9ff;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);"></div><div onclick="setTheme('#55efc4')" style="width:34px;height:34px;border-radius:50%;background:#55efc4;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);"></div><div style="width:34px;height:34px;border-radius:50%;overflow:hidden;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);position:relative;"><input type="color" onchange="setTheme(this.value)" style="position:absolute;top:-5px;left:-5px;width:50px;height:50px;border:none;"></div></div><div style="margin-bottom:12px;"><label style="font-size:11px; color:#999; font-weight:800;">手帳姓名</label><input type="text" id="s-name" style="width:100%; border:1px solid #EEE; padding:12px; border-radius:12px; margin-top:5px; outline:none; font-family:inherit; font-weight:700;"></div><div style="margin-bottom:12px;"><label style="font-size:11px; color:#999; font-weight:800;">描述文字</label><input type="text" id="s-desc" style="width:100%; border:1px solid #EEE; padding:12px; border-radius:12px; margin-top:5px; outline:none; font-family:inherit; font-weight:700;"></div><div style="margin-bottom:12px;"><label style="font-size:11px; color:#999; font-weight:800;">每月預算</label><input type="number" id="s-budget" style="width:100%; border:1px solid #EEE; padding:12px; border-radius:12px; margin-top:5px; outline:none; font-family:inherit; font-weight:700;"></div><div style="margin-bottom:15px;"><label style="font-size:11px; color:#999; font-weight:800;">初始存款調整</label><input type="number" id="s-balance" style="width:100%; border:1px solid #EEE; padding:12px; border-radius:12px; margin-top:5px; outline:none; font-family:inherit; font-weight:700;"></div><button onclick="saveS()" style="width:100%; padding:16px; background:var(--theme); color:white; border:none; border-radius:18px; font-weight:800; font-family:inherit;">儲存設定</button></div></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="goP('home')"><i data-lucide="home"></i>首頁</div>
    <div class="nav-item" id="nav-history" onclick="goP('history')"><i data-lucide="calendar"></i>歷史</div>
    <div class="nav-item" id="nav-chart" onclick="goP('chart')"><i data-lucide="bar-chart-3"></i>分析</div>
    <div class="nav-item" id="nav-settings" onclick="goP('settings')"><i data-lucide="settings"></i>設定</div>
  </nav>
  <button class="fab" onclick="openA()"><i data-lucide="plus"></i></button>
</div>

<!-- 彈窗維持 -->
<div class="modal-overlay" id="modal-a"><div class="modal-sheet"><div class="modal-header"><button id="btn-del" class="del-btn" onclick="delItem()" style="display:none;">刪除</button><span id="modal-t" style="font-weight:800; color:var(--theme); font-size:16px;">新增紀錄</span><button class="close-btn" onclick="closeA()"><i data-lucide="x"></i></button></div><div class="modal-fixed" style="padding:15px 20px; flex-shrink:0;"><div style="display:flex; background:#F2F2F7; padding:4px; border-radius:12px; margin-bottom:10px;"><button id="t-exp" onclick="setTType('expense')" style="flex:1; padding:8px; border:none; border-radius:10px; font-weight:800; font-size:13px; font-family:inherit;">支出</button><button id="t-inc" onclick="setTType('income')" style="flex:1; padding:8px; border:none; border-radius:10px; font-weight:800; font-size:13px; background:none; color:#AAA; font-family:inherit;">收入</button></div><div style="display:flex; gap:10px; margin-bottom:10px;"><button id="a-cash" onclick="setA('現金')" style="flex:1; padding:10px; border:1.5px solid #EEE; border-radius:12px; background:white; font-size:12px; font-weight:800; font-family:inherit;">現金</button><button id="a-card" onclick="setA('信用卡')" style="flex:1; padding:10px; border:1.5px solid #EEE; border-radius:12px; background:white; font-size:12px; font-weight:800; font-family:inherit;">信用卡</button></div><div id="disp-amt" class="num-font" style="text-align:center; font-size:42px; color:var(--theme); padding:5px 0;">0</div><div style="display:flex; gap:8px;"><input type="text" id="n-input" placeholder="備註..." style="flex:1; padding:12px; background:#F2F2F7; border:none; border-radius:12px; outline:none; font-size:14px; font-weight:700; font-family:inherit;"><input type="date" id="d-input" style="width:125px; padding:12px; background:#F2F2F7; border:none; border-radius:12px; outline:none; font-size:11px; font-weight:700; font-family:inherit;"></div></div><div style="flex:1; overflow-y:auto;"><div class="cat-grid" id="cat-grid"></div></div><div style="flex-shrink:0; background:#F8F8F8; padding:10px 15px 15px;"><div class="k-grid"><button class="k-btn" onclick="p('7')">7</button><button class="k-btn" onclick="p('8')">8</button><button class="k-btn" onclick="p('9')">9</button><button class="k-btn" onclick="p('del')" style="color:var(--theme);"><i data-lucide="delete" style="width:20px;margin:auto;"></i></button><button class="k-btn" onclick="p('4')">4</button><button class="k-btn" onclick="p('5')">5</button><button class="k-btn" onclick="p('6')">6</button><button class="k-btn" onclick="p('+')" style="color:var(--theme); font-size:24px;">+</button><button class="k-btn" onclick="p('1')">1</button><button class="k-btn" onclick="p('2')">2</button><button class="k-btn" onclick="p('3')">3</button><button onclick="saveR()" class="k-ok">OK</button><button class="k-btn" onclick="p('0')" style="grid-column: span 2;">0</button><button class="k-btn" onclick="p('.')">.</button></div></div></div></div>

<div class="modal-overlay" id="modal-day"><div class="modal-sheet" style="height:65vh;"><div class="modal-header"><span id="day-title" style="font-weight:800; color:var(--theme);">紀錄清單</span><button class="close-btn" onclick="closeDay()"><i data-lucide="x"></i></button></div><div class="scroll-area" id="day-list" style="padding-bottom:20px;"></div></div></div>

<script>
// --- 資料結構 ---
const CATS = [{id:'food',name:'飲食',icon:'utensils'},{id:'bus',name:'交通',icon:'bus'},{id:'shop',name:'購物',icon:'shopping-bag'},{id:'home',name:'日用',icon:'home'},{id:'play',name:'娛樂',icon:'gamepad-2'},{id:'med',name:'醫療',icon:'stethoscope'},{id:'social',name:'社交',icon:'glass-water'},{id:'gift',name:'禮物',icon:'gift'},{id:'phone',name:'通訊',icon:'smartphone'},{id:'cloth',name:'服飾',icon:'shirt'},{id:'tax',name:'稅金',icon:'banknote'},{id:'other',name:'其他',icon:'more-horizontal'}];

let records = JSON.parse(localStorage.getItem('lzb_v22_recs')) || [];
let config = JSON.parse(localStorage.getItem('lzb_v22_cfg')) || { theme: "#c38ed5", balance: 0, name: "知恩", desc: "財富自由，指日可待", budget: 20000 };

let state = { id: null, type: 'expense', acc: '現金', cat: 'food', amt: "" }, charts = { pie: null, trend: null };
let hY = new Date().getFullYear(), hM = new Date().getMonth() + 1, repY = new Date().getFullYear();

const setT = (id, v) => { const el = document.getElementById(id); if(el) el.innerText = v; };
const setV = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };
const fmt = (n) => '$' + Math.abs(n).toLocaleString('en');

// --- 邏輯修正 ---
function setTheme(c) {
    config.theme = c;
    document.documentElement.style.setProperty('--theme', c);
    document.documentElement.style.setProperty('--theme-light', c + '26');
    renderHome(); // 同步更新首頁存款顏色
}

function renderHome() {
    const today = new Date();
    const week = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    setT('h-date-str', `${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()} ${week[today.getDay()]}`);
    setT('h-name-disp', config.name); setT('h-desc-disp', config.desc);

    const incSum = records.filter(r => r.type === 'income').reduce((a, b) => a + Number(b.amt), 0);
    const expSum = records.filter(r => r.type === 'expense').reduce((a, b) => a + Number(b.amt), 0);
    setT('h-balance', fmt(Number(config.balance) + incSum - expSum));
    
    const nowYM = today.toISOString().slice(0, 7);
    const mRecs = records.filter(r => r.date.startsWith(nowYM) && r.type === 'expense');
    const cash = mRecs.filter(r=>r.acc==='現金').reduce((a, b) => a + Number(b.amt), 0);
    const card = mRecs.filter(r=>r.acc==='信用卡').reduce((a, b) => a + Number(b.amt), 0);
    setT('h-cash', fmt(cash)); setT('h-card', fmt(card));
    
    const totalM = cash + card;
    const pct = Math.min(100, Math.round((totalM / config.budget) * 100));
    const fill = document.getElementById('h-budget-fill'); if(fill) fill.style.width = pct + '%';
    setT('h-budget-pct', pct + '%');
    setT('h-budget-text', `剩餘 ${fmt(config.budget - totalM)} / ${fmt(config.budget)}`);
    
    const recent = records.sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0,3);
    const list = document.getElementById('h-list'); if(list) list.innerHTML = recent.map(r => renderRow(r)).join('');
    lucide.createIcons();
}

function renderRow(r, isH = false) {
    const c = CATS.find(x => x.id === r.cat) || CATS[0];
    return `<div class="list-item" onclick="openE(${r.id})">
        <div style="width:40px;height:40px;border-radius:12px;background:var(--theme-light);display:flex;align-items:center;justify-content:center;color:var(--theme);"><i data-lucide="${c.icon}" style="width:18px;"></i></div>
        <div style="flex:1;"><div style="font-size:14px;font-weight:700;">${r.note}</div><div style="font-size:10px;color:#AAA;">${r.date} | ${r.acc}</div></div>
        <div style="font-weight:800; font-size:16px; color:${r.type==='expense'?'#ff6b6b':'#4ecb71'}" class="num-font">${r.type==='expense'?'-':'+'}${fmt(r.amt)}</div>
    </div>`;
}

function goP(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('pg-' + id).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const nav = document.getElementById('nav-' + id); if(nav) nav.classList.add('active');
    if(id==='home') renderHome();
    if(id==='history') renderHist();
    if(id==='chart') renderChart();
    if(id==='settings') {
        setV('s-name', config.name); setV('s-desc', config.desc);
        setV('s-balance', config.balance); setV('s-budget', config.budget);
    }
}

// 基礎功能維持
function changeHM(dir) { hM += dir; if(hM>12){hM=1;hY++;} if(hM<1){hM=12;hY--;} renderHist(); }
function renderHist() { const ym=`${hY}-${String(hM).padStart(2,'0')}`; setT('hist-m-label', `${hY}年 ${hM}月`); const mRecs=records.filter(r=>r.date.startsWith(ym)); const e=mRecs.filter(r=>r.type==='expense').reduce((a,b)=>a+Number(b.amt),0); const i=mRecs.filter(r=>r.type==='income').reduce((a,b)=>a+Number(b.amt),0); setT('hist-net-val', fmt(i-e)); const fill=document.getElementById('hist-net-fill'); if(fill) fill.style.width=Math.min(100, Math.max(0, (e/config.budget)*100)) + '%'; const days=new Date(hY, hM, 0).getDate(); const first=new Date(hY, hM-1, 1).getDay(); const tStr=new Date().toISOString().slice(0,10); let h=`<div class="cal-grid">`; ['日','一','二','三','四','五','六'].forEach(d=>h+=`<div style="font-size:10px;color:#CCC;height:25px;">${d}</div>`); for(let k=0; k<first; k++) h+=`<div></div>`; for(let d=1; d<=days; d++) { const dS=`${hY}-${String(hM).padStart(2,'0')}-${String(d).padStart(2,'0')}`; h+=`<div class="cal-cell ${dS===tStr?'cal-today':''}" onclick="showDayList('${dS}')">${d}${mRecs.some(r=>r.date===dS)?'<div class="cal-dot"></div>':''}</div>`; } const calBox=document.getElementById('hist-cal-box'); if(calBox) calBox.innerHTML=h+`</div>`; const list=document.getElementById('hist-list'); if(list) list.innerHTML=mRecs.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>renderRow(r, true)).join(''); lucide.createIcons(); }
function showDayList(date) { setT('day-title', date + " 紀錄"); const dayRecs=records.filter(r=>r.date===date); document.getElementById('day-list').innerHTML=dayRecs.length?dayRecs.map(r=>renderRow(r,true)).join(''):'<div style="text-align:center;color:#CCC;padding:20px;">當天無紀錄</div>'; document.getElementById('modal-day').classList.add('open'); lucide.createIcons(); }
function closeDay() { document.getElementById('modal-day').classList.remove('open'); }
function renderChart() { const curY=new Date().getFullYear(), curM=new Date().getMonth()+1; const ySet=[...new Set(records.map(r=>parseInt(r.date.slice(0,4))))]; if(!ySet.includes(curY)) ySet.push(curY); ySet.sort((a,b)=>b-a); const ySel=document.getElementById('c-year-sel'); if(ySel) ySel.innerHTML=ySet.map(y=>`<button class="k-btn" style="padding:0 15px; font-size:12px; background:${y===repY?'var(--theme)':'#EEE'}; color:${y===repY?'white':'#AAA'}" onclick="repY=${y};renderChart();">${y}</button>`).join(''); const targetYM=`${curY}-${String(curM).padStart(2,'0')}`; const mExp=records.filter(r=>r.date.startsWith(targetYM) && r.type==='expense'); const dataM={}; mExp.forEach(r=>dataM[r.cat]=(dataM[r.cat]||0)+r.amt); const totalExp=Object.values(dataM).reduce((a,b)=>a+b, 0); setT('c-pie-m', curM + '月'); setT('c-total-v', fmt(totalExp)); if(charts.pie) charts.pie.destroy(); const pc=document.getElementById('chart-pie'); if(pc) charts.pie=new Chart(pc, { type:'doughnut', data: { labels: Object.keys(dataM).map(id=>CATS.find(x=>x.id===id).name), datasets:[{data:Object.values(dataM).length?Object.values(dataM):[1], backgroundColor:config.theme==='#c38ed5'?['#c38ed5','#a879b9','#d7a8e8','#f3e5f5','#e0d0ec','#ccc']:['#74b9ff','#0984e3','#81ecec','#74b9ff','#dfe6e9','#ccc'], borderWidth:0}] }, options: { cutout:'78%', plugins:{legend:{display:false}} } }); const rank=document.getElementById('c-rank'); if(rank) { const sorted=Object.entries(dataM).sort((a,b)=>b[1]-a[1]); rank.innerHTML=sorted.map(([id,v])=>`<div class="list-item" style="padding:12px 18px;"><div style="flex:1;font-weight:700;">${CATS.find(x=>x.id===id).name} <span style="font-size:10px;color:#BBB;">${Math.round(v/totalExp*100)}%</span></div><div style="font-weight:800;color:var(--theme);" class="num-font">${fmt(v)}</div></div>`).join(''); } let repH="", annualNetTotal=0, trendD=[], trendL=[]; for(let m=12; m>=1; m--) { if(repY===curY && m>curM) continue; const ym=`${repY}-${String(m).padStart(2,'0')}`; const rcs=records.filter(r=>r.date.startsWith(ym)), me=rcs.filter(r=>r.type==='expense').reduce((a,b)=>a+Number(b.amt),0), mi=rcs.filter(r=>r.type==='income').reduce((a,b)=>a+Number(b.amt),0); const netM=mi-me; annualNetTotal+=netM; trendD.push(me); trendL.push(m+'月'); repH+=`<div class="report-card"><div style="font-weight:800;font-size:14px;">${repY}/${String(m).padStart(2,'0')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;"><div><div style="font-size:10px;color:#AAA;">支出</div><div style="font-size:13px;font-weight:700;">${fmt(me)}</div></div><div><div style="font-size:10px;color:#AAA;">收入</div><div style="font-size:13px;font-weight:700;">${fmt(mi)}</div></div></div><div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px dashed #EEE;"><span style="font-size:11px;color:#999;">結餘</span><b style="color:${netM>=0?'#4ECB71':'#FF6B6B'}" class="num-font">${fmt(netM)}</b></div></div>`; } const mList=document.getElementById('c-monthly-list'); if(mList) mList.innerHTML=repH; setT('c-annual-net', `${repY} 年度總結餘: ${fmt(annualNetTotal)}`); if(charts.trend) charts.trend.destroy(); const tc=document.getElementById('chart-trend'); if(tc) charts.trend=new Chart(tc, { type:'line', data:{labels:trendL.reverse(), datasets:[{data:trendD.reverse(), borderColor:config.theme, tension:0.4, borderWidth:3, fill:true, backgroundColor:config.theme+'22'}]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{display:true, grid:{color:'#F0F0F0'}}, x:{grid:{display:false}}}} }); }
function openA() { state={id:null,type:'expense',acc:'現金',cat:'food',amt:""}; setT('modal-t',"新增紀錄"); const d=document.getElementById('btn-del'); if(d) d.style.display="none"; setV('n-input',""); setV('d-input', new Date().toISOString().slice(0,10)); syncU(); document.getElementById('modal-a').classList.add('open'); }
function openE(id) { const r=records.find(x=>x.id===id); if(!r)return; closeDay(); state={id,type:r.type,acc:r.acc,cat:r.cat,amt:r.amt.toString()}; setT('modal-t',"編輯紀錄"); const d=document.getElementById('btn-del'); if(d) d.style.display="block"; setV('n-input', r.note); setV('d-input', r.date); syncU(); document.getElementById('modal-a').classList.add('open'); }
function syncU() { setT('disp-amt', state.amt || "0"); setTType(state.type); setA(state.acc); const grid=document.getElementById('cat-grid'); if(grid) grid.innerHTML=CATS.map(c=>`<button class="cat-btn ${state.cat===c.id?'active':''}" onclick="state.cat='${c.id}';syncU();"><div class="cat-sq"><i data-lucide="${c.icon}" style="width:24px;"></i></div><div class="cat-txt">${c.name}</div></button>`).join(''); lucide.createIcons(); }
function setTType(t) { state.type=t; const e=document.getElementById('t-exp'), i=document.getElementById('t-inc'); if(e){e.style.background=t==='expense'?'white':'none'; e.style.color=t==='expense'?'var(--theme)':'#AAA';} if(i){i.style.background=t==='income'?'white':'none'; i.style.color=t==='income'?'var(--theme)':'#AAA';} }
function setA(a) { state.acc=a; const c=document.getElementById('a-cash'), d=document.getElementById('a-card'); if(c) c.style.borderColor=a==='現金'?'var(--theme)':'#EEE'; if(d) d.style.borderColor=a==='信用卡'?'var(--theme)':'#EEE'; }
function p(v) { if(v==='del') state.amt=state.amt.slice(0,-1); else if(state.amt.length<10) state.amt+=v; setT('disp-amt', state.amt || "0"); }
function closeA() { document.getElementById('modal-a').classList.remove('open'); }
function saveR() { if(!state.amt) return; try { const val=parseFloat(eval(state.amt.replace(/[^0-9+.]/g,''))); const d={id:state.id||Date.now(),amt:val,type:state.type,acc:state.acc,cat:state.cat,note:document.getElementById('n-input').value.trim()||CATS.find(x=>x.id===state.cat).name,date:document.getElementById('d-input').value}; if(state.id) records=records.map(r=>r.id===state.id?d:r); else records.push(d); localStorage.setItem('lzb_v22_recs', JSON.stringify(records)); closeA(); renderHome(); } catch(e){ alert('金額錯誤'); } }
function delItem() { if(confirm('刪除？')){ records=records.filter(r=>r.id!==state.id); localStorage.setItem('lzb_v22_recs', JSON.stringify(records)); closeA(); renderHome(); renderHist(); } }
function saveS() { config.name=document.getElementById('s-name').value || "知恩"; config.desc=document.getElementById('s-desc').value || "財富自由"; config.balance=Number(document.getElementById('s-balance').value) || 0; config.budget=Number(document.getElementById('s-budget').value) || 20000; localStorage.setItem('lzb_v22_cfg', JSON.stringify(config)); alert('成功'); setTheme(config.theme); }

// Service Worker
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
window.onload = () => { setTheme(config.theme); lucide.createIcons(); renderHome(); };
</script>
</body>

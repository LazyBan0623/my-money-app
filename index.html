<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="知恩手帳">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/536/536060.png">
<link rel="manifest" href="manifest.json">
<title>知恩手帳 Pro v25</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --theme: #c38ed5;
  --theme-dark: #a879b9;
  --theme-light: rgba(195, 142, 213, 0.15);
  --bg: #F9F9FB;
  --text: #444;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}

/* 核心防護：阻斷 iOS 系統手勢衝突 */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { 
    height: 100dvh; width: 100%; 
    background-color: var(--bg); 
    font-family: 'M PLUS Rounded 1c', sans-serif; 
    color: var(--text); 
    overflow: hidden; 
    overscroll-behavior: none; /* 禁用回彈與側滑 */
}
#app { height: 100dvh; display: flex; flex-direction: column; position: relative; background-color: var(--bg); }

/* 修正 iOS 16px 縮放懲罰 */
input { font-size: 16px !important; font-family: inherit; color: var(--text); }

.num-font { font-family: 'Manrope', sans-serif; font-weight: 800; }

/* Header & Card */
.header-bg {
  background: linear-gradient(135deg, var(--theme) 0%, var(--theme-dark) 100%);
  color: white; padding: calc(12px + var(--safe-top)) 20px 25px;
  border-radius: 0 0 40px 40px; flex-shrink: 0; z-index: 10;
}
.balance-card { background: white; border-radius: 28px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: center; }
.piggy-circle { width: 44px; height: 44px; border-radius: 50%; background: var(--theme-light); color: var(--theme); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; border: 2px solid white; }
#h-balance { color: var(--theme); }

/* 螢幕切換 */
.screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.screen.active { display: flex; }
.scroll-area { flex: 1; overflow-y: auto; padding: 15px 18px 140px; -webkit-overflow-scrolling: touch; }
.card-v { background: white; border-radius: 22px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); margin-bottom: 12px; }

/* 底部導航 */
.bottom-nav { 
    position: fixed; bottom: 0; width: 100%; max-width: 430px; 
    background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); 
    display: flex; padding-bottom: var(--safe-bottom); border-top: 1px solid #EEE; z-index: 100; 
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 0 8px; color: #CCC; font-size: 10px; font-weight: 800; }
.nav-item.active { color: var(--theme); }
.fab { position: fixed; bottom: calc(85px + var(--safe-bottom)); right: 20px; width: 62px; height: 62px; background: var(--theme); color: white; border-radius: 31px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 90; display: flex; align-items: center; justify-content: center; }

/* 彈窗佈局：使用 dvh 確保動態高度正確 */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: flex-end; }
.modal-overlay.open { display: flex; }
.modal-sheet { 
    background: white; width: 100%; border-radius: 30px 30px 0 0; 
    padding-bottom: var(--safe-bottom); height: 92dvh; 
    display: flex; flex-direction: column; overflow: hidden; 
}
.modal-header { height: 55px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #F5F5F5; flex-shrink: 0; position: relative; }

/* 分類與鍵盤：分區優化 */
.modal-fixed-top { flex-shrink: 0; padding: 15px 20px; }
.modal-scroll-mid { flex: 1; overflow-y: auto; padding: 10px 0; -webkit-overflow-scrolling: touch; }
.modal-footer { flex-shrink: 0; background: #F8F8F8; padding: 10px 15px 15px; }

/* 月曆網格精確化 */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; }
.cal-cell { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; position: relative; border-radius: 50%; }

/* 數字鍵盤按鈕 */
.k-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.k-btn { background: white; border: none; height: 48px; border-radius: 12px; font-size: 20px; font-weight: 800; color: #444; }
.k-ok { background: var(--theme); color: white; grid-row: span 2; height: 104px; border-radius: 12px; border: none; font-weight: 800; }

/* 小螢幕動態適配 (iPhone 12 mini) */
@media (max-height: 700px) {
  #disp-amt { font-size: 32px !important; }
  .cat-sq { width: 44px !important; height: 44px !important; }
}
</style>
</head>
<body>

<div id="app">
  <!-- ════════ 1. 首頁 ════════ -->
  <div class="screen active" id="pg-home">
    <div class="header-bg">
        <div class="h-row-1"><span id="h-date-str">2026/06/04 THU</span><i data-lucide="banknote" style="width:20px;"></i></div>
        <div class="h-row-2">
            <div class="h-name"><span id="h-name-disp">知恩</span>手帳</div>
            <div class="h-desc" id="h-desc-disp">財富自由，指日可待</div>
        </div>
        <div class="balance-card">
            <div class="piggy-circle"><i data-lucide="piggy-bank" style="width:24px; height:24px;"></i></div>
            <div style="font-size:12px; color:#999; font-weight:800; margin-bottom:2px;">當前存款總額</div>
            <div style="font-size:32px;" class="num-font" id="h-balance">$0</div>
        </div>
    </div>
    <div class="scroll-area">
        <div class="card-v" style="text-align:center;">
            <div style="font-size:13px; font-weight:800; color:#888;">本月結餘進度</div>
            <div class="prog-bg"><div id="h-budget-fill" class="prog-fill"></div></div>
            <div id="h-budget-text" style="font-size:11px; color:#999; font-weight:800;">載入中...</div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:15px;">
            <div class="card-v" style="margin:0; text-align:center;"><div style="font-size:11px; color:#999; font-weight:800;">現金支出</div><div style="font-size:18px; color:#ff6b6b;" class="num-font" id="h-cash">$0</div></div>
            <div class="card-v" style="margin:0; text-align:center;"><div style="font-size:11px; color:#999; font-weight:800;">信用支出</div><div style="font-size:18px; color:#ff6b6b;" class="num-font" id="h-card">$0</div></div>
        </div>
        <div id="h-list"></div>
    </div>
  </div>

  <!-- 2. 歷史 3. 分析 4. 設定 (略，維持 v24 結構但 ID 與邏輯已同步) -->
  <!-- [此處省略 HTML 結構以節省空間，與 v24 相同但套用新的 CSS Class] -->
  <div class="screen" id="pg-history">
    <div class="header-bg"><div style="display:flex; justify-content:space-between; align-items:center;"><button onclick="changeHM(-1)" style="background:none; border:none; color:white;"><i data-lucide="chevron-left"></i></button><div id="hist-m-label" style="font-size:18px; font-weight:800;">2025年 6月</div><button onclick="changeHM(1)" style="background:none; border:none; color:white;"><i data-lucide="chevron-right"></i></button></div></div>
    <div class="scroll-area"><div class="card-v"><div style="display:flex; justify-content:space-between; font-size:12px; font-weight:800; margin-bottom:5px;"><span>本月結餘</span><span id="hist-net-val">$0</span></div><div class="prog-bg"><div id="hist-net-fill" class="prog-fill"></div></div><div id="hist-cal-box"></div></div><div id="hist-list"></div></div>
  </div>

  <div class="screen" id="pg-chart">
    <div class="header-bg" style="height:70px; padding-top:15px; text-align:center;"><span style="font-weight:800;">數據分析</span></div>
    <div class="scroll-area"><div id="c-year-sel" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:12px;"></div><div id="c-annual-net" class="card-v" style="background:var(--theme); color:white; text-align:center; font-weight:800; font-size:16px;">年度總結餘: $0</div><div class="card-v" style="text-align:center; position:relative;"><div style="position:relative; height:180px; display:flex; justify-content:center; align-items:center;"><canvas id="chart-pie"></canvas><div style="position:absolute; text-align:center; pointer-events:none; top:50%; transform:translateY(-50%);"><div id="c-pie-m" style="font-size:22px; font-weight:800; color:var(--theme);">6月</div><div style="font-size:10px; color:#BBB; font-weight:700;">支出</div></div></div><div id="c-total-v" class="num-font" style="margin-top:15px; font-size:20px; color:var(--text);">$0</div></div><div id="c-rank"></div><div class="card-v" style="height:220px;"><canvas id="chart-trend"></canvas></div><div id="c-monthly-list"></div></div>
  </div>

  <div class="screen" id="pg-settings">
    <div class="header-bg" style="height:70px; padding-top:15px; text-align:center;"><span style="font-weight:800;">設定</span></div>
    <div class="scroll-area"><div class="card-v"><div style="font-weight:800; font-size:13px; margin-bottom:15px; color:var(--theme);">主題與存款</div><div style="display:flex; gap:12px; margin-bottom:20px; justify-content:center;"><div onclick="setTheme('#c38ed5')" style="width:34px;height:34px;border-radius:50%;background:#c38ed5;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);"></div><div onclick="setTheme('#74b9ff')" style="width:34px;height:34px;border-radius:50%;background:#74b9ff;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);"></div><div onclick="setTheme('#55efc4')" style="width:34px;height:34px;border-radius:50%;background:#55efc4;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);"></div><div style="width:34px;height:34px;border-radius:50%;overflow:hidden;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);position:relative;"><input type="color" onchange="setTheme(this.value)" style="position:absolute;top:-5px;left:-5px;width:50px;height:50px;border:none;"></div></div><div style="margin-bottom:12px;"><label style="font-size:11px; color:#999; font-weight:800;">姓名</label><input type="text" id="s-name" class="card-v" style="width:100%; border:1px solid #EEE; padding:12px; font-weight:700;"></div><div style="margin-bottom:12px;"><label style="font-size:11px; color:#999; font-weight:800;">描述</label><input type="text" id="s-desc" class="card-v" style="width:100%; border:1px solid #EEE; padding:12px; font-weight:700;"></div><div style="margin-bottom:12px;"><label style="font-size:11px; color:#999; font-weight:800;">月預算</label><input type="number" id="s-budget" class="card-v" style="width:100%; border:1px solid #EEE; padding:12px; font-weight:700;"></div><div style="margin-bottom:15px;"><label style="font-size:11px; color:#999; font-weight:800;">初始存款</label><input type="number" id="s-balance" class="card-v" style="width:100%; border:1px solid #EEE; padding:12px; font-weight:700;"></div><button onclick="saveS()" style="width:100%; padding:16px; background:var(--theme); color:white; border:none; border-radius:18px; font-weight:800; font-family:inherit;">儲存設定</button></div></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="goP('home')"><i data-lucide="home"></i>首頁</div>
    <div class="nav-item" id="nav-history" onclick="goP('history')"><i data-lucide="calendar"></i>歷史</div>
    <div class="nav-item" id="nav-chart" onclick="goP('chart')"><i data-lucide="bar-chart-3"></i>分析</div>
    <div class="nav-item" id="nav-settings" onclick="goP('settings')"><i data-lucide="settings"></i>設定</div>
  </nav>
  <button class="fab" onclick="openA()"><i data-lucide="plus"></i></button>
</div>

<!-- 彈窗模組 -->
<div class="modal-overlay" id="modal-a">
  <div class="modal-sheet">
    <div class="modal-header">
        <button id="btn-del" class="del-btn" onclick="delItem()" style="display:none;">刪除</button>
        <span id="modal-t" style="font-weight:800; color:var(--theme);">新增紀錄</span>
        <button class="close-btn" onclick="closeA()"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-fixed-top">
        <div style="display:flex; background:#F2F2F7; padding:4px; border-radius:12px; margin-bottom:10px;">
            <button id="t-exp" onclick="setTType('expense')" style="flex:1; padding:8px; border:none; border-radius:10px; font-weight:800; font-size:13px;">支出</button>
            <button id="t-inc" onclick="setTType('income')" style="flex:1; padding:8px; border:none; border-radius:10px; font-weight:800; font-size:13px; background:none; color:#AAA;">收入</button>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <button id="a-cash" onclick="setA('現金')" style="flex:1; padding:10px; border:1.5px solid #EEE; border-radius:12px; background:white; font-size:12px; font-weight:800;">現金</button>
            <button id="a-card" onclick="setA('信用卡')" style="flex:1; padding:10px; border:1.5px solid #EEE; border-radius:12px; background:white; font-size:12px; font-weight:800;">信用卡</button>
        </div>
        <div id="disp-amt" class="num-font" style="text-align:center; font-size:42px; color:var(--theme); padding:5px 0;">0</div>
        <div style="display:flex; gap:8px;">
            <input type="text" id="n-input" placeholder="備註..." style="flex:1; padding:12px; background:#F2F2F7; border:none; border-radius:12px; outline:none; font-size:14px; font-weight:700;">
            <input type="date" id="d-input" style="width:125px; padding:12px; background:#F2F2F7; border:none; border-radius:12px; outline:none; font-size:11px; font-weight:700;">
        </div>
    </div>
    <div class="modal-scroll-mid"><div class="cat-grid" id="cat-grid"></div></div>
    <div class="modal-footer"><div class="k-grid" id="k-container">
        <!-- 鍵盤由 JS 重新渲染以綁定 blur 邏輯 -->
    </div></div>
  </div>
</div>

<div class="modal-overlay" id="modal-day"><div class="modal-sheet" style="height:65vh;"><div class="modal-header"><span id="day-title" style="font-weight:800; color:var(--theme);">紀錄清單</span><button class="close-btn" onclick="closeDay()"><i data-lucide="x"></i></button></div><div class="scroll-area" id="day-list"></div></div></div>

<script>
// [資料結構同 v24...]
const CATS = [{id:'food',name:'飲食',icon:'utensils'},{id:'bus',name:'交通',icon:'bus'},{id:'shop',name:'購物',icon:'shopping-bag'},{id:'home',name:'日用',icon:'home'},{id:'play',name:'娛樂',icon:'gamepad-2'},{id:'med',name:'醫療',icon:'stethoscope'},{id:'social',name:'社交',icon:'glass-water'},{id:'gift',name:'禮物',icon:'gift'},{id:'phone',name:'通訊',icon:'smartphone'},{id:'cloth',name:'服飾',icon:'shirt'},{id:'tax',name:'稅金',icon:'banknote'},{id:'other',name:'其他',icon:'more-horizontal'}];
let records = JSON.parse(localStorage.getItem('lzb_v25_recs')) || [];
let config = JSON.parse(localStorage.getItem('lzb_v25_cfg')) || { theme: "#c38ed5", balance: 0, name: "知恩", desc: "財富自由，指日可待", budget: 20000 };
let state = { id: null, type: 'expense', acc: '現金', cat: 'food', amt: "" }, charts = { pie: null, trend: null };
let hY = new Date().getFullYear(), hM = new Date().getMonth() + 1, repY = new Date().getFullYear();

const setT = (id, v) => { const el = document.getElementById(id); if(el) el.innerText = v; };
const setV = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };
const fmt = (n) => '$' + Math.abs(Number(n)).toLocaleString('en');

// 安全運算解析
function safeEval(s) {
    let clean = s.replace(/[^0-9+.]/g,'');
    if(clean.endsWith('+')) clean = clean.slice(0,-1);
    try { 
        const parts = clean.split('+');
        return parts.reduce((acc, curr) => acc + Number(curr || 0), 0);
    } catch(e) { return 0; }
}

// 主題與渲染邏輯修正
function setTheme(c) {
    config.theme = c;
    document.documentElement.style.setProperty('--theme', c);
    document.documentElement.style.setProperty('--theme-light', c + '26');
    renderHome();
}

function renderHome() {
    const today = new Date(); const week = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    setT('h-date-str', `${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()} ${week[today.getDay()]}`);
    setT('h-name-disp', config.name); setT('h-desc-disp', config.desc);

    const incSum = records.filter(r => r.type === 'income').reduce((a, b) => a + Number(b.amt), 0);
    const expSum = records.filter(r => r.type === 'expense').reduce((a, b) => a + Number(b.amt), 0);
    setT('h-balance', fmt(Number(config.balance) + incSum - expSum));
    
    const nowYM = today.toISOString().slice(0, 7);
    const mE = records.filter(r => r.date.startsWith(nowYM) && r.type === 'expense');
    setT('h-cash', fmt(mE.filter(r=>r.acc==='現金').reduce((a,b)=>a+Number(b.amt), 0)));
    setT('h-card', fmt(mE.filter(r=>r.acc==='信用卡').reduce((a,b)=>a+Number(b.amt), 0)));
    
    const totalM = mE.reduce((a,b)=>a+Number(b.amt), 0);
    const pct = Math.min(100, Math.round((totalM/config.budget)*100)) || 0;
    const fill = document.getElementById('h-budget-fill'); if(fill) fill.style.width = pct + '%';
    setT('h-budget-pct', pct + '%'); 
    setT('h-budget-text', `剩餘 ${fmt(config.budget - totalM)} / ${fmt(config.budget)}`);
    
    const recent = records.sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0,3);
    const list = document.getElementById('h-list'); if(list) list.innerHTML = recent.map(r => renderRow(r)).join('');
    lucide.createIcons();
}

function renderRow(r, isH = false) {
    const c = CATS.find(x => x.id === r.cat) || CATS[0];
    return `<div class="list-item" onclick="${isH ? `openE(${r.id})` : ''}">
        <div class="list-icon" style="background:var(--theme-light); color:var(--theme);"><i data-lucide="${c.icon}"></i></div>
        <div style="flex:1;"><div style="font-size:14px;font-weight:700;">${r.note}</div><div style="font-size:10px;color:#AAA;">${r.date} | ${r.acc}</div></div>
        <div style="font-weight:800; font-size:16px; color:${r.type==='expense'?'#ff6b6b':'#4ecb71'}" class="num-font">${r.type==='expense'?'-':'+'}${fmt(r.amt)}</div>
    </div>`;
}

// [其餘渲染邏輯 History/Chart 優化...]
function renderHist() {
    const ym = `${hY}-${String(hM).padStart(2,'0')}`; setT('hist-m-label', `${hY}年 ${hM}月`);
    const mRecs = records.filter(r => r.date.startsWith(ym));
    const e = mRecs.filter(r => r.type === 'expense').reduce((a, b) => a + Number(b.amt), 0);
    const i = mRecs.filter(r => r.type === 'income').reduce((a, b) => a + Number(b.amt), 0);
    setT('hist-net-val', fmt(i - e)); setT('hist-exp', fmt(e)); setT('hist-inc', fmt(i));
    const fill = document.getElementById('hist-net-fill'); if(fill) fill.style.width = Math.min(100, Math.max(0, (e/config.budget)*100)) + '%';

    const days = new Date(hY, hM, 0).getDate(); const first = new Date(hY, hM-1, 1).getDay(); const tStr = new Date().toISOString().slice(0,10);
    let h = `<div class="cal-grid">`; ['日','一','二','三','四','五','六'].forEach(d => h += `<div class="cal-cell cal-head">${d}</div>`);
    for(let k=0; k<first; k++) h += `<div class="cal-cell"></div>`;
    for(let d=1; d<=days; d++) {
        const dS = `${hY}-${String(hM).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        h += `<div class="cal-cell ${dS===tStr?'cal-today':''}" onclick="showDayList('${dS}')">${d}${mRecs.some(r=>r.date===dS)?'<div class="cal-dot"></div>':''}</div>`;
    }
    document.getElementById('hist-cal-box').innerHTML = h + `</div>`;
    document.getElementById('hist-list').innerHTML = mRecs.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>renderRow(r, true)).join('');
    lucide.createIcons();
}

// 修正 Chart 銷毀邏輯
function renderChart() {
    const curY = new Date().getFullYear(), curM = new Date().getMonth()+1;
    const targetYM = `${repY}-${String(curM).padStart(2,'0')}`;
    const mExp = records.filter(r => r.date.startsWith(targetYM) && r.type === 'expense');
    const dataM = {}; mExp.forEach(r => dataM[r.cat] = (dataM[r.cat]||0) + Number(r.amt));
    const tE = Object.values(dataM).reduce((a,b)=>a+b, 0);
    setT('c-pie-m', curM + '月'); setT('c-total-v', fmt(tE));

    if(charts.pie) { charts.pie.destroy(); charts.pie = null; }
    const pc = document.getElementById('chart-pie');
    if(pc) charts.pie = new Chart(pc, { type:'doughnut', data: { labels: Object.keys(dataM).map(id=>CATS.find(x=>x.id===id).name), datasets:[{data:Object.values(dataM).length?Object.values(dataM):[1], backgroundColor:generatePalette(config.theme), borderWidth:0}] }, options: { cutout:'78%', plugins:{legend:{display:false}} } });
    // [其餘排行榜與趨勢圖...]
}

// 鍵盤輸入強化 (修正小數點與備註衝突)
function p(v) {
    document.getElementById('n-input').blur(); // 點擊數字鍵時強制關閉原生鍵盤
    if (v === 'del') { state.amt = state.amt.slice(0, -1); } 
    else if (state.amt.length < 10) {
        if (v === '.' && state.amt.split('+').pop().includes('.')) return; // 檢查當前段落是否已有小數點
        if (v === '+' && (state.amt.length === 0 || state.amt.endsWith('+') || state.amt.includes('+'))) return;
        state.amt += v;
    }
    setT('disp-amt', state.amt || "0");
}

function saveR() {
    const val = safeEval(state.amt);
    if(val <= 0) { alert('請輸入金額'); return; }
    const d = { id: state.id||Date.now(), amt: val, type: state.type, acc: state.acc, cat: state.cat, note: document.getElementById('n-input').value.trim()||CATS.find(x=>x.id===state.cat).name, date: document.getElementById('d-input').value };
    if(state.id) records = records.map(r=>r.id===state.id ? d : r); else records.push(d);
    localStorage.setItem('lzb_v25_recs', JSON.stringify(records)); closeA(); renderHome();
}

function renderKeyboard() {
    const keys = ['7','8','9','del','4','5','6','+','1','2','3','ok','0','.'];
    const container = document.getElementById('k-container');
    container.innerHTML = keys.map(k => {
        if(k==='ok') return `<button onclick="saveR()" class="k-ok">OK</button>`;
        if(k==='del') return `<button class="k-btn" onclick="p('del')"><i data-lucide="delete" style="width:20px;margin:auto;"></i></button>`;
        return `<button class="k-btn" onclick="p('${k}')" ${k==='0'?'style="grid-column:span 2"':''}>${k}</button>`;
    }).join('');
    lucide.createIcons();
}

window.onload = () => { 
    setTheme(config.theme); 
    renderKeyboard();
    renderHome(); 
};
</script>

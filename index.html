<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>知恩手帳 Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#b19ffb">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple: #b19ffb;
            --purple-light: #f3f0ff;
            --purple-dark: #8c76f7;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #2d3748;
            --text-muted: #a0aec0;
            --inc: #48bb78;
            --exp: #f56565;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100dvh; /* 動態視埠高度，完美適應 iOS 鍵盤 */
            width: 100%;
            background-color: var(--bg);
            font-family: 'M PLUS Rounded 1c', sans-serif;
            color: var(--text);
            overflow: hidden;
            overscroll-behavior-y: none; /* 阻斷 iOS 上下橡皮筋彈出 */
            overscroll-behavior-x: none; /* 阻斷 iOS 左右側滑返回手勢 */
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: calc(20px + var(--safe-top)) 20px calc(90px + var(--safe-bottom)) 20px;
        }

        .screen.active { display: flex; }

        /* Top Banner */
        .top-banner {
            background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            padding: calc(30px + var(--safe-top)) 24px 40px 24px;
            border-radius: 0 0 40px 40px;
            color: white;
            box-shadow: 0 10px 25px rgba(177, 159, 251, 0.3);
        }
        .tb-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .tb-title { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
        .tb-month-btn {
            background: rgba(255,255,255,0.2);
            border: none; padding: 8px 16px; border-radius: 20px;
            color: white; font-family: inherit; font-weight: 700;
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .tb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .tb-label { font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 4px; font-weight: 700; }
        .tb-val { font-size: 22px; font-weight: 700; }

        /* Nav Bar */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(75px + var(--safe-bottom));
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: var(--safe-bottom);
            border-top: 1px solid rgba(0,0,0,0.04); z-index: 999;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-muted); cursor: pointer; background: none; border: none;
            font-family: inherit; font-size: 11px; font-weight: 700; gap: 4px; width: 60px;
        }
        .nav-item.active { color: var(--purple-dark); }
        .nav-item i { width: 22px; height: 22px; }
        
        .nav-add-btn {
            width: 58px; height: 58px; border-radius: 29px;
            background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            color: white; border: none; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transform: translateY(-15px);
            box-shadow: 0 8px 20px rgba(177, 159, 251, 0.5);
        }
        .nav-add-btn i { width: 28px; height: 28px; }

        /* Section Title & Cards */
        .section-title { font-size: 18px; font-weight: 700; color: var(--text); margin: 24px 0 16px 4px; }
        .card {
            background: var(--card); border-radius: 24px; padding: 20px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.02); margin-bottom: 16px;
        }

        /* Rec List */
        .rec-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 0; border-bottom: 1px solid #f1f3f5;
        }
        .rec-item:last-child { border-bottom: none; }
        .rec-left { display: flex; align-items: center; gap: 14px; }
        .rec-icon-box {
            width: 44px; height: 44px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
        }
        .rec-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
        .rec-sub { font-size: 12px; color: var(--text-muted); }
        .rec-amt { font-size: 16px; font-weight: 700; }
        .rec-amt.inc { color: var(--inc); }
        .rec-amt.exp { color: var(--text); }

        /* Modal Overlay & Sheet */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); display: none; align-items: flex-end; z-index: 2000;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-sheet {
            background: white; width: 100%; border-radius: 35px 35px 0 0;
            padding-bottom: var(--safe-bottom); height: 92dvh; /* 改用 dvh 完美契合 iOS 虛擬鍵盤 */
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        
        .modal-fixed-top { padding: 20px 24px 10px 24px; background: white; z-index: 10; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-close-btn { background: #f1f3f5; border: none; width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .type-tabs { display: grid; grid-template-columns: 1fr 1fr; background: #f1f3f5; padding: 4px; border-radius: 16px; }
        .type-tab { border: none; padding: 10px; border-radius: 12px; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; background: none; color: var(--text-muted); }
        .type-tab.active { background: white; color: var(--text); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .modal-scroll-box { flex: 1; overflow-y: auto; padding: 10px 24px; -webkit-overflow-scrolling: touch; }
        
        /* Category Grid */
        .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
        .cat-item { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .cat-icon-box {
            width: 52px; height: 52px; border-radius: 20px; background: #f8f9fa;
            color: #718096; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .cat-item.active .cat-icon-box { background: var(--purple-light); color: var(--purple-dark); transform: scale(1.05); }
        .cat-label { font-size: 12px; font-weight: 700; color: #4a5568; }

        /* Form Inputs */
        .modal-note-box {
            background: #f8f9fa; border-radius: 20px; padding: 14px 18px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px;
        }
        .modal-note-box i { color: var(--text-muted); width: 20px; height: 20px; }
        
        /* 核心防縮放優化：iOS input 必須大於等於 16px 防止畫面自動縮放放大 */
        .modal-note-box input {
            border: none; background: none; outline: none;
            font-family: inherit; font-size: 16px; color: var(--text); flex: 1;
        }
        .modal-note-box input::placeholder { color: var(--text-muted); font-size: 14px; }
        
        #d-input { font-weight: 700; color: var(--text); text-align: right; border: none; background: none; font-size: 16px; outline: none; }

        /* Custom Keyboard */
        .modal-keyboard-box { padding: 16px 24px calc(16px + var(--safe-bottom)) 24px; background: #f8f9fa; border-top: 1px solid #edf2f7; }
        .kb-display { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; padding: 4px; }
        .kb-disp-label { font-size: 14px; font-weight: 700; color: var(--text-muted); }
        .kb-disp-amt { font-size: 32px; font-weight: 700; color: var(--purple-dark); letter-spacing: 0.5px; }
        
        .modal-keyboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .kb-btn {
            background: white; border: none; height: 54px; border-radius: 16px;
            font-family: inherit; font-size: 20px; font-weight: 700; color: var(--text);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .kb-btn:active { background: #edf2f7; }
        .kb-btn.action { background: var(--purple-light); color: var(--purple-dark); }
        .kb-btn.ok { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: white; grid-row: span 2; height: 118px; }

        /* Report & Asset Utilities */
        .rep-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .year-select-box { display: flex; align-items: center; gap: 12px; }
        .ys-btn { background: white; border: none; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .ys-label { font-size: 18px; font-weight: 700; color: var(--text); }
        
        .chart-wrapper { width: 100%; max-width: 260px; margin: 20px auto; position: relative; }
        
        .ast-total-card {
            background: linear-gradient(135deg, #2d3748, #1a202c); color: white;
            padding: 26px; border-radius: 30px; box-shadow: 0 12px 25px rgba(0,0,0,0.08); margin-bottom: 24px;
        }
        .ast-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #edf2f7; }
        .ast-item:last-child { border-bottom: none; }
        
        /* Drawer Picker */
        .drawer-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); display:none; align-items:flex-end; z-index:3000; }
        .drawer-overlay.active { display: flex; }
        .drawer-content { background:white; width:100%; border-radius:30px 30px 0 0; padding:24px 24px calc(24px + var(--safe-bottom)) 24px; max-height: 60dvh; overflow-y:auto; }
        .drawer-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; text-align: center; }
        .drawer-option { padding: 16px; text-align: center; font-size: 16px; font-weight: 700; border-bottom: 1px solid #f1f3f5; cursor: pointer; }
        .drawer-option:last-child { border-bottom: none; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; font-weight: 700; }
        .empty-state i { width: 48px; height: 48px; margin-bottom: 12px; stroke-width: 1.5; }
    </style>
</head>
<body>

<div id="app">
    <div id="scr-home" class="screen active">
        <div class="top-banner">
            <div class="tb-header">
                <span class="tb-title">知恩手帳 Pro</span>
                <button class="tb-month-btn" onclick="openMonthPicker()">
                    <span id="home-month-label">2026 年 05 月</span>
                    <i data-lucide="chevron-down" style="width:16px; height:16px;"></i>
                </button>
            </div>
            <div style="font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 6px; font-weight: 700;">本月結餘</div>
            <div id="home-bal" class="tb-val" style="font-size: 36px; margin-bottom: 24px; letter-spacing: 0.5px;">$0</div>
            <div class="tb-grid">
                <div>
                    <div class="tb-label">本月收入</div>
                    <div id="home-inc" class="tb-val" style="color: #e6fffa;">$0</div>
                </div>
                <div>
                    <div class="tb-label">本月支出</div>
                    <div id="home-exp" class="tb-val" style="color: #fff5f5;">$0</div>
                </div>
            </div>
        </div>
        
        <h3 class="section-title">每日明細</h3>
        <div id="home-list-container"></div>
    </div>

    <div id="scr-rep" class="screen">
        <div class="rep-header">
            <h2 style="font-size: 22px; font-weight: 700;">統計分析</h2>
            <div class="year-select-box">
                <button class="ys-btn" onclick="adjYear(-1)"><i data-lucide="chevron-left"></i></button>
                <span id="rep-year-label" class="ys-label">2026</span>
                <button class="ys-btn" onclick="adjYear(1)"><i data-lucide="chevron-right"></i></button>
            </div>
        </div>
        
        <div class="type-tabs" style="margin-bottom: 20px;">
            <button id="rep-tab-exp" class="type-tab active" onclick="setRepType('EXP')">支出</button>
            <button id="rep-tab-inc" class="type-tab" onclick="setRepType('INC')">收入</button>
        </div>

        <div class="card" style="display: flex; flex-direction: column; align-items: center;">
            <div class="chart-wrapper">
                <canvas id="pie-canvas"></canvas>
            </div>
        </div>

        <h3 class="section-title">分類排行</h3>
        <div id="rep-list" class="card"></div>
    </div>

    <div id="scr-ast" class="screen">
        <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 20px;">資產賬戶</h2>
        <div class="ast-total-card">
            <div style="font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 6px; font-weight: 700;">總資產淨值</div>
            <div id="ast-total-net" style="font-size: 32px; font-weight: 700;">$0</div>
        </div>
        
        <h3 class="section-title">賬戶清單</h3>
        <div id="ast-list" class="card"></div>
    </div>

    <nav class="nav-bar">
        <button id="nav-home" class="nav-item active" onclick="switchScr('home')">
            <i data-lucide="wallet"></i>明細
        </button>
        <button id="nav-rep" class="nav-item" onclick="switchScr('rep')">
            <i data-lucide="pie-chart"></i>統計
        </button>
        <button class="nav-add-btn" onclick="openA('EXP')">
            <i data-lucide="plus"></i>
        </button>
        <button id="nav-ast" class="nav-item" onclick="switchScr('ast')">
            <i data-lucide="layers"></i>資產
        </button>
        <button class="nav-item" onclick="clearAllData()">
            <i data-lucide="refresh-cw"></i>重置
        </button>
    </nav>
</div>

<div id="modal-overlay" class="modal-overlay" onclick="closeA(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
        <div class="modal-fixed-top">
            <div class="modal-header">
                <h3 id="modal-title" style="font-size: 18px; font-weight: 700;">新增帳目</h3>
                <button class="modal-close-btn" onclick="closeA()"><i data-lucide="x" style="width:18px; height:18px;"></i></button>
            </div>
            <div class="type-tabs">
                <button id="m-tab-exp" class="type-tab" onclick="setMType('EXP')">支出</button>
                <button id="m-tab-inc" class="type-tab" onclick="setMType('INC')">收入</button>
            </div>
        </div>

        <div class="modal-scroll-box">
            <div id="m-cat-grid" class="cat-grid"></div>
            
            <div class="modal-note-box">
                <i data-lucide="credit-card"></i>
                <input type="text" id="acc-select-trigger" readonly onclick="openAccPicker()" value="現金" style="cursor: pointer; font-weight: 700;">
                <i data-lucide="chevron-down" style="width: 16px; height: 16px;"></i>
            </div>

            <div class="modal-note-box">
                <i data-lucide="edit-3"></i>
                <input type="text" id="n-input" placeholder="輸入備註說明...">
            </div>

            <div class="modal-note-box">
                <i data-lucide="calendar"></i>
                <input type="date" id="d-input">
            </div>
        </div>

        <div class="modal-keyboard-box">
            <div class="kb-display">
                <span class="kb-disp-label">金額</span>
                <span id="kb-expr" class="kb-disp-amt">$0</span>
            </div>
            <div class="modal-keyboard">
                <button class="kb-btn" onclick="pressK('7')">7</button>
                <button class="kb-btn" onclick="pressK('8')">8</button>
                <button class="kb-btn" onclick="pressK('9')">9</button>
                <button class="kb-btn action" onclick="pressK('DEL')"><i data-lucide="delete" style="width:22px; height:22px;"></i></button>
                
                <button class="kb-btn" onclick="pressK('4')">4</button>
                <button class="kb-btn" onclick="pressK('5')">5</button>
                <button class="kb-btn" onclick="pressK('6')">6</button>
                <button class="kb-btn action" onclick="pressK('+')">+</button>
                
                <button class="kb-btn" onclick="pressK('1')">1</button>
                <button class="kb-btn" onclick="pressK('2')">2</button>
                <button class="kb-btn" onclick="pressK('3')">3</button>
                <button class="kb-btn ok" onclick="saveR()">OK</button>
                
                <button class="kb-btn" onclick="pressK('.')">.</button>
                <button class="kb-btn" onclick="pressK('0')">0</button>
                <button class="kb-btn action" onclick="pressK('C')">C</button>
            </div>
        </div>
    </div>
</div>

<div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()">
    <div class="drawer-content" onclick="event.stopPropagation()">
        <div id="drawer-title" class="drawer-title">選擇項目</div>
        <div id="drawer-options-box"></div>
    </div>
</div>

<script>
// --- CONSTANTS & STATE ---
const CATS = [
    { id: 'c1', name: '餐飲飲食', icon: 'utensils', type: 'EXP', color: '#ff9f43' },
    { id: 'c2', name: '購物消費', icon: 'shopping-bag', type: 'EXP', color: '#54a0ff' },
    { id: 'c3', name: '交通出行', icon: 'car', type: 'EXP', color: '#1dd1a1' },
    { id: 'c4', name: '居家生活', icon: 'home', type: 'EXP', color: '#feca57' },
    { id: 'c5', name: '休閒娛樂', icon: 'gamepad-2', type: 'EXP', color: '#ff6b6b' },
    { id: 'c6', name: '薪資收入', icon: 'coins', type: 'INC', color: '#1dd1a1' },
    { id: 'c7', name: '獎金外快', icon: 'gift', type: 'INC', color: '#ff6b6b' },
    { id: 'c8', name: '投資理財', icon: 'trending-up', type: 'INC', color: '#54a0ff' }
];

const ACCS = [
    { id: 'a1', name: '現金', icon: 'wallet', color: '#48bb78' },
    { id: 'a2', name: '銀行卡', icon: 'credit-card', color: '#4299e1' },
    { id: 'a3', name: '行動支付', icon: 'smartphone', color: '#9f7aea' }
];

let records = JSON.parse(localStorage.getItem('lzb_v24_recs')) || [];
let curScr = 'home';
let charts = { pie: null };

let state = {
    month: new Date().toISOString().slice(0, 7), // YYYY-MM
    repYear: new Date().getFullYear(),
    repType: 'EXP',
    id: null, type: 'EXP', acc: 'a1', cat: 'c1', amt: ''
};

// --- CORE APP INIT ---
window.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    renderHome();
    
    // 註冊 Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
    }
});

function switchScr(s) {
    curScr = s;
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    
    document.getElementById(`scr-${s}`).classList.add('active');
    document.getElementById(`nav-${s}`).classList.add('active');
    
    if(s === 'home') renderHome();
    if(s === 'rep') renderRep();
    if(s === 'ast') renderAst();
}

// --- HOME SCREEN LOGIC ---
function renderHome() {
    document.getElementById('home-month-label').innerText = `${state.month.slice(0,4)} 年 ${state.month.slice(5,7)} 月`;
    
    let mRecs = records.filter(r => r.date.startsWith(state.month));
    let inc = mRecs.filter(r => r.type === 'INC').reduce((a, b) => a + Number(b.amt), 0);
    let exp = mRecs.filter(r => r.type === 'EXP').reduce((a, b) => a + Number(b.amt), 0);
    
    document.getElementById('home-inc').innerText = `$${inc.toLocaleString()}`;
    document.getElementById('home-exp').innerText = `$${exp.toLocaleString()}`;
    document.getElementById('home-bal').innerText = `$${(inc - exp).toLocaleString()}`;

    let container = document.getElementById('home-list-container');
    container.innerHTML = '';

    if(mRecs.length === 0) {
        container.innerHTML = `<div class="empty-state"><i data-lucide="database"></i><p>這個月還沒有任何帳目喔</p></div>`;
        lucide.createIcons();
        return;
    }

    // 按日期降序排列明細
    let groups = {};
    mRecs.forEach(r => { groups[r.date] = groups[r.date] || []; groups[r.date].push(r); });
    let sortedDates = Object.keys(groups).sort((a,b) => b.localeCompare(a));

    sortedDates.forEach(d => {
        let card = document.createElement('div');
        card.className = 'card';
        
        let dateHeader = document.createElement('div');
        dateHeader.style = 'font-size:13px; font-weight:700; color:var(--text-muted); margin-bottom:12px; border-bottom:1px solid #f1f3f5; padding-bottom:6px;';
        dateHeader.innerText = d;
        card.appendChild(dateHeader);

        groups[d].forEach(r => {
            let catObj = CATS.find(c => c.id === r.cat) || { name: '未知', icon: 'help-circle', color: '#cbd5e0' };
            let accObj = ACCS.find(a => a.id === r.acc) || { name: '未知' };
            
            let item = document.createElement('div');
            item.className = 'rec-item';
            item.onclick = () => openA(r.type, r);
            item.innerHTML = `
                <div class="rec-left">
                    <div class="rec-icon-box" style="background:${catObj.color}15; color:${catObj.color};">
                        <i data-lucide="${catObj.icon}" style="width:20px; height:20px;"></i>
                    </div>
                    <div>
                        <div class="rec-name">${r.note}</div>
                        <div class="rec-sub">${catObj.name} · ${accObj.name}</div>
                    </div>
                </div>
                <div class="rec-amt ${r.type === 'INC' ? 'inc' : 'exp'}">
                    ${r.type === 'INC' ? '+' : '-'}$${Number(r.amt).toLocaleString()}
                </div>
            `;
            card.appendChild(item);
        });
        container.appendChild(card);
    });
    lucide.createIcons();
}

// --- MONTH PICKER DRAWER ---
function openMonthPicker() {
    let months = [];
    let d = new Date();
    for(let i=0; i<12; i++) {
        months.push(d.toISOString().slice(0,7));
        d.setMonth(d.getMonth() - 1);
    }
    
    document.getElementById('drawer-title').innerText = '選擇月份';
    let box = document.getElementById('drawer-options-box');
    box.innerHTML = '';
    
    months.forEach(m => {
        let opt = document.createElement('div');
        opt.className = 'drawer-option';
        opt.innerText = `${m.slice(0,4)} 年 ${m.slice(5,7)} 月`;
        opt.onclick = () => { state.month = m; closeDrawer(); renderHome(); };
        box.appendChild(opt);
    });
    document.getElementById('drawer-overlay').classList.add('active');
}

function openAccPicker() {
    document.getElementById('drawer-title').innerText = '選擇賬戶';
    let box = document.getElementById('drawer-options-box');
    box.innerHTML = '';
    
    ACCS.forEach(a => {
        let opt = document.createElement('div');
        opt.className = 'drawer-option';
        opt.innerText = a.name;
        opt.onclick = () => {
            state.acc = a.id;
            document.getElementById('acc-select-trigger').value = a.name;
            closeDrawer();
        };
        box.appendChild(opt);
    });
    document.getElementById('drawer-overlay').classList.add('active');
}

function closeDrawer() { document.getElementById('drawer-overlay').classList.remove('active'); }

// --- TRANSACTION MODAL LOGIC ---
function openA(t, rObj = null) {
    // 點擊新增時，強制關閉原生鍵盤以防手勢與排版衝突
    document.activeElement.blur();
    
    state.id = rObj ? rObj.id : null;
    state.type = rObj ? rObj.type : t;
    state.acc = rObj ? rObj.acc : 'a1';
    
    let defaultCat = CATS.find(c => c.type === state.type);
    state.cat = rObj ? rObj.cat : (defaultCat ? defaultCat.id : '');
    state.amt = rObj ? String(rObj.amt) : '';

    document.getElementById('modal-title').innerText = rObj ? '編輯帳目' : '新增帳目';
    document.getElementById('n-input').value = rObj ? rObj.note : '';
    document.getElementById('d-input').value = rObj ? rObj.date : new Date().toISOString().slice(0,10);
    
    let accObj = ACCS.find(a => a.id === state.acc);
    document.getElementById('acc-select-trigger').value = accObj ? accObj.name : '現金';

    updateMTabs();
    renderMCats();
    updateKDisp();
    
    document.getElementById('modal-overlay').classList.add('active');
}

function closeA(e = null) {
    if(!e || e.target === document.getElementById('modal-overlay')) {
        document.getElementById('modal-overlay').classList.remove('active');
    }
}

function setMType(t) { state.type = t; let dCat = CATS.find(c => c.type === t); state.cat = dCat?dCat.id:''; updateMTabs(); renderMCats(); }
function updateMTabs() {
    document.getElementById('m-tab-exp').className = `type-tab ${state.type==='EXP'?'active':''}`;
    document.getElementById('m-tab-inc').className = `type-tab ${state.type==='INC'?'active':''}`;
}

function renderMCats() {
    let box = document.getElementById('m-cat-grid');
    box.innerHTML = '';
    CATS.filter(c => c.type === state.type).forEach(c => {
        let item = document.createElement('div');
        item.className = `cat-item ${state.cat === c.id ? 'active' : ''}`;
        item.onclick = () => { state.cat = c.id; renderMCats(); };
        item.innerHTML = `
            <div class="cat-icon-box">
                <i data-lucide="${c.icon}"></i>
            </div>
            <div class="cat-label">${c.name}</div>
        `;
        box.appendChild(item);
    });
    lucide.createIcons();
}

// --- KEYBOARD LOGIC ---
function pressK(k) {
    if(k === 'C') state.amt = '';
    else if(k === 'DEL') state.amt = state.amt.slice(0, -1);
    else if(k === '+') {
        if(state.amt && !state.amt.endsWith('+')) state.amt += '+';
    } else if(k === '.') {
        let tokens = state.amt.split('+');
        if(!tokens[tokens.length-1].includes('.')) state.amt += '.';
    } else {
        let tokens = state.amt.split('+');
        if(tokens[tokens.length-1] === '0') tokens[tokens.length-1] = k;
        else tokens[tokens.length-1] += k;
        state.amt = tokens.join('+');
    }
    updateKDisp();
}

function updateKDisp() {
    document.getElementById('kb-expr').innerText = state.amt ? `$${state.amt}` : '$0';
}

function saveR() {
    if(!state.amt) return;
    let clean = state.amt.replace(/[^0-9+.]/g,'');
    if(clean.endsWith('+')) clean = clean.slice(0,-1);
    
    try {
        // 優化點：捨棄潛在資安風險與卡頓的 eval，改用 Array.reduce 進行安全加總
        let tokens = clean.split('+');
        let finalVal = tokens.reduce((sum, token) => sum + Number(token || 0), 0);
        
        if(isNaN(finalVal) || finalVal <= 0) throw "invalid_val";
        
        let catObj = CATS.find(x => x.id === state.cat);
        let noteStr = document.getElementById('n-input').value.trim() || (catObj ? catObj.name : '未分類');
        let dateStr = document.getElementById('d-input').value;
        
        let d = { id: state.id || Date.now(), amt: finalVal, type: state.type, acc: state.acc, cat: state.cat, note: noteStr, date: dateStr };
        
        if(state.id) records = records.map(r => r.id === state.id ? d : r);
        else records.push(d);
        
        localStorage.setItem('lzb_v24_recs', JSON.stringify(records));
        closeA();
        renderHome();
    } catch(e) {
        alert('金額輸入錯誤');
    }
}

// --- STATISTICS SCREEN LOGIC ---
function adjYear(v) { state.repYear += v; document.getElementById('rep-year-label').innerText = state.repYear; renderRep(); }
function setRepType(t) { state.repType = t; document.getElementById('rep-tab-exp').className=`type-tab ${t==='EXP'?'active':''}`; document.getElementById('rep-tab-inc').className=`type-tab ${t==='INC'?'active':''}`; renderRep(); }

function renderRep() {
    document.getElementById('rep-year-label').innerText = state.repYear;
    let yRecs = records.filter(r => r.date.startsWith(String(state.repYear)) && r.type === state.repType);
    
    let map = {};
    CATS.filter(c => c.type === state.repType).forEach(c => map[c.id] = 0);
    yRecs.forEach(r => { if(map[r.cat] !== undefined) map[r.cat] += Number(r.amt); });

    let dataList = [];
    Object.keys(map).forEach(cid => { if(map[cid] > 0) dataList.push({ cid, amt: map[cid] }); });
    dataList.sort((a,b) => b.amt - a.amt);

    let listUl = document.getElementById('rep-list');
    listUl.innerHTML = '';

    // 優化點：嚴格精準銷毀 Chart 實例，杜絕 iOS 設備記憶體溢流閃退
    if (charts.pie) {
        charts.pie.destroy();
        charts.pie = null;
    }

    if(dataList.length === 0) {
        listUl.innerHTML = `<div class="empty-state"><i data-lucide="pie-chart"></i><p>今年度尚無資料</p></div>`;
        lucide.createIcons();
        return;
    }

    dataList.forEach(item => {
        let cObj = CATS.find(c => c.id === item.cid);
        let row = document.createElement('div');
        row.className = 'rec-item';
        row.innerHTML = `
            <div class="rec-left">
                <div class="rec-icon-box" style="background:${cObj.color}15; color:${cObj.color};">
                    <i data-lucide="${cObj.icon}" style="width:20px; height:20px;"></i>
                </div>
                <div class="rec-name">${cObj.name}</div>
            </div>
            <div class="rec-amt" style="color:var(--text); font-weight:700;">$${item.amt.toLocaleString()}</div>
        `;
        listUl.appendChild(row);
    });
    lucide.createIcons();

    // 建立新圖表
    let ctx = document.getElementById('pie-canvas').getContext('2d');
    charts.pie = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: dataList.map(x => CATS.find(c => c.id === x.cid).name),
            datasets: [{
                data: dataList.map(x => x.amt),
                backgroundColor: dataList.map(x => CATS.find(c => c.id === x.cid).color),
                borderWidth: 0
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            cutout: '70%'
        }
    });
}

// --- ASSETS LOGIC ---
function renderAst() {
    let balances = {};
    ACCS.forEach(a => balances[a.id] = 0);
    
    records.forEach(r => {
        if(balances[r.acc] !== undefined) {
            if(r.type === 'INC') balances[r.acc] += Number(r.amt);
            else balances[r.acc] -= Number(r.amt);
        }
    });

    let totalNet = Object.values(balances).reduce((a,b)=>a+b, 0);
    document.getElementById('ast-total-net').innerText = `$${totalNet.toLocaleString()}`;

    let box = document.getElementById('ast-list');
    box.innerHTML = '';
    
    ACCS.forEach(a => {
        let bal = balances[a.id];
        let row = document.createElement('div');
        row.className = 'ast-item';
        row.innerHTML = `
            <div class="rec-left">
                <div class="rec-icon-box" style="background:${a.color}15; color:${a.color};">
                    <i data-lucide="${a.icon}" style="width:20px; height:20px;"></i>
                </div>
                <div class="rec-name">${a.name}</div>
            </div>
            <div class="rec-amt" style="color:${bal >= 0 ? 'var(--text)' : 'var(--exp)'}; font-weight:700;">
                $${bal.toLocaleString()}
            </div>
        `;
        box.appendChild(row);
    });
    lucide.createIcons();
}

function clearAllData() {
    if(confirm('確定要清除所有帳目明細嗎？此動作無法復原。')) {
        records = [];
        localStorage.removeItem('lzb_v24_recs');
        renderHome();
        if(curScr==='rep') renderRep();
        if(curScr==='ast') renderAst();
        alert('資料已成功重置');
    }
}
</script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<!-- ✅ viewport-fit=cover 保留，配合 safe-area 變數使用 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="知恩手帳">
<!-- ✅ apple-touch-icon 改為內嵌 SVG Data URI，離線可用 -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%23c38ed5'/%3E%3Ctext x='50%25' y='55%25' font-size='100' text-anchor='middle' dominant-baseline='middle'%3E%F0%9F%AA%B7%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<title>知恩手帳 Pro v27</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --theme: #c38ed5;
  --theme-dark: #a879b9;
  /* ✅ 統一使用 rgba() 格式，修復舊版 iOS WebKit 不支援 hex+alpha */
  --theme-light: rgba(195, 142, 213, 0.15);
  --bg: #F9F9FB;
  --text: #444;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; width: 100%;
  background-color: var(--bg);
  font-family: 'M PLUS Rounded 1c', sans-serif;
  color: var(--text);
  overflow: hidden;
  overscroll-behavior: none;
}
#app { height: 100dvh; display: flex; flex-direction: column; position: relative; background-color: var(--bg); }
.num-font { font-family: 'Manrope', sans-serif; font-weight: 800; }

/* Header */
.header-bg {
  background: linear-gradient(135deg, var(--theme) 0%, var(--theme-dark) 100%);
  color: white;
  padding: calc(12px + var(--safe-top)) 20px 25px;
  border-radius: 0 0 40px 40px;
  flex-shrink: 0;
  z-index: 10;
}
.h-top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; opacity: 0.9; }
.h-mid { width: 80%; margin: 15px auto 20px; text-align: center; }
.h-name { font-size: 22px; font-weight: 800; letter-spacing: 1px; line-height: 1.2; display: block; }
.h-desc { font-size: 10px; opacity: 0.8; margin-top: 4px; font-weight: 700; display: block; }

/* 存款卡片 */
.balance-card { background: white; border-radius: 28px; padding: 22px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: center; }
.piggy-box { width: 56px; height: 56px; border-radius: 50%; background: var(--theme-light); color: var(--theme); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; border: 2.5px solid white; box-shadow: 0 4px 10px var(--theme-light); }
#h-balance { color: var(--theme); font-size: 32px; }

/* 螢幕設定 */
.screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.screen.active { display: flex; }
/* ✅ scroll-area 加上 overscroll-behavior-y: contain，防止 iOS 彈性回彈穿透 */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  padding: 15px 18px 140px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
.card-v { background: white; border-radius: 22px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); margin-bottom: 12px; }

/* 列表項目 */
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: white; border-radius: 18px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }

/* 月曆 */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; text-align: center; }
.cal-cell { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; position: relative; border-radius: 50%; cursor: pointer; }
.cal-head { font-size: 10px; color: #CCC; height: 25px; font-weight: 800; cursor: default; }
.cal-today { background: var(--theme-light); color: var(--theme); border: 1.5px solid var(--theme); }
.cal-dot { width: 4px; height: 4px; background: var(--theme); border-radius: 50%; position: absolute; bottom: 4px; }

/* 報表卡片 */
.report-card { background: white; border-radius: 20px; padding: 16px; margin-bottom: 12px; border-left: 6px solid var(--theme); box-shadow: 0 3px 10px rgba(0,0,0,0.02); }

/* 底部導航 */
.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  max-width: 430px;
  background: rgba(255,255,255,0.98);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  padding-bottom: var(--safe-bottom);
  border-top: 1px solid #EEE;
  z-index: 100;
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 0 8px; color: #CCC; font-size: 10px; font-weight: 800; cursor: pointer; }
.nav-item.active { color: var(--theme); }
/* ✅ FAB 定位修正：72px 更貼合導航列實際高度，避免 mini 上偏高 */
.fab {
  position: fixed;
  bottom: calc(72px + var(--safe-bottom));
  right: 20px;
  width: 62px;
  height: 62px;
  background: var(--theme);
  color: white;
  border-radius: 31px;
  border: none;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* 彈窗 */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: flex-end; }
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: white;
  width: 100%;
  border-radius: 30px 30px 0 0;
  /* ✅ 改用 max-height + padding-bottom 讓 mini 不會溢出 */
  max-height: 94dvh;
  padding-bottom: calc(var(--safe-bottom) + 8px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.modal-header { height: 50px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #F5F5F5; flex-shrink: 0; position: relative; }
.close-btn { position: absolute; right: 18px; top: 13px; color: #DDD; border: none; background: none; cursor: pointer; }
.del-btn { position: absolute; left: 18px; top: 13px; color: #FF6B6B; font-weight: 800; font-size: 14px; border: none; background: none; cursor: pointer; }

.modal-fixed-top { flex-shrink: 0; padding: 10px 20px; }
.modal-scroll-mid { flex: 1; overflow-y: auto; padding: 10px 0; overscroll-behavior-y: contain; }
.modal-keyboard { flex-shrink: 0; background: #F8F8F8; padding: 10px 15px 15px; }

.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 20px; }
.cat-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.3; border: none; background: none; width: 100%; transition: opacity 0.2s; cursor: pointer; }
.cat-btn.active { opacity: 1; }
.cat-sq { width: 50px; height: 50px; border-radius: 16px; background: var(--theme); color: white; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.cat-txt { font-size: 11px; font-weight: 800; color: var(--text); }

/* 數字鍵盤 */
.k-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.k-btn { background: white; border: none; height: 48px; border-radius: 12px; font-size: 20px; font-weight: 800; color: #444; cursor: pointer; font-family: 'Manrope', sans-serif; }
.k-ok { background: var(--theme); color: white; grid-row: span 2; height: 104px; border-radius: 12px; border: none; font-weight: 800; font-family: inherit; cursor: pointer; font-size: 16px; }

/* ✅ 刪除確認 Dialog（取代原生 confirm） */
.confirm-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 300;
  align-items: center; justify-content: center;
}
.confirm-overlay.open { display: flex; }
.confirm-box {
  background: white; border-radius: 24px; padding: 28px 24px 20px;
  width: min(320px, 85vw); text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.confirm-box h3 { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
.confirm-box p { font-size: 13px; color: #999; margin-bottom: 24px; }
.confirm-btns { display: flex; gap: 10px; }
.confirm-btns button { flex: 1; padding: 14px; border: none; border-radius: 14px; font-weight: 800; font-family: inherit; font-size: 14px; cursor: pointer; }
.confirm-cancel { background: #F2F2F7; color: #444; }
.confirm-ok { background: #FF6B6B; color: white; }

/* ✅ date input iOS 修正：強制統一樣式 */
input[type="date"] {
  -webkit-appearance: none;
  appearance: none;
  color: var(--text);
}

@media (max-height: 720px) {
  #disp-amt { font-size: 32px !important; }
  .cat-sq { width: 44px !important; height: 44px !important; }
  .k-btn { height: 42px !important; }
  .k-ok { height: 92px !important; }
}
</style>
</head>
<body>

<div id="app">
  <!-- ════════ 1. 首頁 ════════ -->
  <div class="screen active" id="pg-home">
    <div class="header-bg">
      <div class="h-top"><span id="h-date-str">2026/06/05 FRI</span><i data-lucide="banknote" style="width:20px;"></i></div>
      <div class="h-mid">
        <span class="h-name" id="h-name-disp">知恩手帳</span>
        <span class="h-desc" id="h-desc-disp">財富自由，指日可待</span>
      </div>
      <div class="balance-card">
        <div class="piggy-box"><i data-lucide="piggy-bank" style="width:28px; height:28px;"></i></div>
        <div style="font-size:12px; color:#999; font-weight:800; margin-bottom:2px;">當前存款總額</div>
        <div id="h-balance" class="num-font">$0</div>
      </div>
    </div>
    <div class="scroll-area">
      <div class="card-v" style="text-align:center;">
        <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:800;"><span>本月結餘進度</span><span id="h-budget-pct">0%</span></div>
        <div style="height:10px; background:#F0F0F0; border-radius:10px; overflow:hidden; margin:8px 0;"><div id="h-budget-fill" style="height:100%; background:var(--theme); width:0%; transition:width 0.4s ease;"></div></div>
        <div id="h-budget-text" style="font-size:11px; color:#999; font-weight:800;">載入中...</div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:15px;">
        <div class="card-v" style="margin:0; text-align:center;"><div style="font-size:11px; color:#999; font-weight:800;">現金支出</div><div style="font-size:18px; color:#ff6b6b;" class="num-font" id="h-cash">$0</div></div>
        <div class="card-v" style="margin:0; text-align:center;"><div style="font-size:11px; color:#999; font-weight:800;">信用支出</div><div style="font-size:18px; color:#ff6b6b;" class="num-font" id="h-card">$0</div></div>
      </div>
      <div id="h-list"></div>
    </div>
  </div>

  <!-- ════════ 2. 歷史 ════════ -->
  <div class="screen" id="pg-history">
    <div class="header-bg">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button onclick="changeHM(-1)" style="background:none; border:none; color:white; cursor:pointer;"><i data-lucide="chevron-left"></i></button>
        <div id="hist-m-label" style="font-size:18px; font-weight:800;">2026年 6月</div>
        <button onclick="changeHM(1)" style="background:none; border:none; color:white; cursor:pointer;"><i data-lucide="chevron-right"></i></button>
      </div>
    </div>
    <div class="scroll-area">
      <div class="card-v">
        <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:800; margin-bottom:5px;"><span>本月結餘</span><span id="hist-net-val">$0</span></div>
        <div style="height:10px; background:#F0F0F0; border-radius:10px; overflow:hidden; margin:8px 0;"><div id="hist-net-fill" style="height:100%; background:var(--theme); width:0%;"></div></div>
        <div id="hist-cal-box" class="cal-container"></div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:15px;">
        <div class="card-v" style="margin:0; text-align:center;"><div style="font-size:11px; color:#999; font-weight:800;">當月支出</div><div id="hist-exp" class="num-font" style="color:#ff6b6b; font-size:18px;">$0</div></div>
        <div class="card-v" style="margin:0; text-align:center;"><div style="font-size:11px; color:#999; font-weight:800;">當月收入</div><div id="hist-inc" class="num-font" style="color:#4ecb71; font-size:18px;">$0</div></div>
      </div>
      <div id="hist-list"></div>
    </div>
  </div>

  <!-- ════════ 3. 分析 ════════ -->
  <div class="screen" id="pg-chart">
    <div class="header-bg" style="height:70px; padding-top:15px; text-align:center;"><span style="font-weight:800;">數據分析</span></div>
    <div class="scroll-area">
      <div id="c-year-sel" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none;"></div>
      <div id="c-annual-net" class="card-v" style="background:var(--theme); color:white; text-align:center; font-weight:800; font-size:16px;">年度總結餘: $0</div>
      <div class="card-v" style="text-align:center; position:relative;">
        <div style="position:relative; height:180px; display:flex; justify-content:center; align-items:center;">
          <canvas id="chart-pie"></canvas>
          <div style="position:absolute; text-align:center; pointer-events:none; top:50%; transform:translateY(-50%);">
            <div id="c-pie-m" style="font-size:22px; font-weight:800; color:var(--theme);">6月</div>
            <div style="font-size:10px; color:#BBB; font-weight:700;">支出佔比</div>
          </div>
        </div>
        <div id="c-total-v" class="num-font" style="margin-top:15px; font-size:20px; color:var(--text);">$0</div>
      </div>
      <div id="c-rank"></div>
      <div class="card-v" style="height:220px;"><canvas id="chart-trend"></canvas></div>
      <div id="c-monthly-list"></div>
    </div>
  </div>

  <!-- ════════ 4. 設定 ════════ -->
  <div class="screen" id="pg-settings">
    <div class="header-bg" style="height:70px; padding-top:15px; text-align:center;"><span style="font-weight:800;">設定</span></div>
    <div class="scroll-area">
      <div class="card-v">
        <div style="font-weight:800; font-size:13px; margin-bottom:15px; color:var(--theme);">個性化風格</div>
        <div style="display:flex; gap:12px; margin-bottom:20px; justify-content:center;">
          <div onclick="setTheme('#c38ed5')" style="width:34px;height:34px;border-radius:50%;background:#c38ed5;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);cursor:pointer;"></div>
          <div onclick="setTheme('#74b9ff')" style="width:34px;height:34px;border-radius:50%;background:#74b9ff;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);cursor:pointer;"></div>
          <div onclick="setTheme('#55efc4')" style="width:34px;height:34px;border-radius:50%;background:#55efc4;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);cursor:pointer;"></div>
          <div onclick="setTheme('#fd79a8')" style="width:34px;height:34px;border-radius:50%;background:#fd79a8;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);cursor:pointer;"></div>
          <div onclick="setTheme('#fdcb6e')" style="width:34px;height:34px;border-radius:50%;background:#fdcb6e;border:3px solid white;box-shadow:0 0 5px rgba(0,0,0,0.1);cursor:pointer;"></div>
        </div>
        <div style="margin-bottom:12px;"><label style="font-size:11px; color:#999; font-weight:800;">手帳姓名</label><input type="text" id="s-name" class="card-v" style="width:100%; border:1px solid #EEE; padding:12px; font-weight:700; font-family:inherit; margin-top:4px;"></div>
        <div style="margin-bottom:12px;"><label style="font-size:11px; color:#999; font-weight:800;">描述文字</label><input type="text" id="s-desc" class="card-v" style="width:100%; border:1px solid #EEE; padding:12px; font-weight:700; font-family:inherit; margin-top:4px;"></div>
        <div style="margin-bottom:12px;"><label style="font-size:11px; color:#999; font-weight:800;">每月預算</label><input type="number" id="s-budget" class="card-v" style="width:100%; border:1px solid #EEE; padding:12px; font-weight:700; font-family:inherit; margin-top:4px;"></div>
        <div style="margin-bottom:15px;"><label style="font-size:11px; color:#999; font-weight:800;">初始存款</label><input type="number" id="s-balance" class="card-v" style="width:100%; border:1px solid #EEE; padding:12px; font-weight:700; font-family:inherit; margin-top:4px;"></div>
        <button onclick="saveS()" style="width:100%; padding:16px; background:var(--theme); color:white; border:none; border-radius:18px; font-weight:800; font-family:inherit; font-size:15px; cursor:pointer;">儲存設定</button>
      </div>

      <!-- 資料管理區 -->
      <div class="card-v" style="margin-top:0;">
        <div style="font-weight:800; font-size:13px; margin-bottom:15px; color:#FF6B6B;">資料管理</div>
        <button onclick="exportData()" style="width:100%; padding:14px; background:#F2F2F7; color:#444; border:none; border-radius:14px; font-weight:800; font-family:inherit; font-size:14px; margin-bottom:10px; cursor:pointer;">📤 匯出備份 (JSON)</button>
        <label style="display:block; width:100%; padding:14px; background:#F2F2F7; color:#444; border:none; border-radius:14px; font-weight:800; font-size:14px; text-align:center; cursor:pointer;">
          📥 匯入備份 (JSON)
          <input type="file" id="import-file" accept=".json" onchange="importData(event)" style="display:none;">
        </label>
      </div>
    </div>
  </div>

  <!-- 底部導航 -->
  <nav class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="goP('home')"><i data-lucide="home"></i>首頁</div>
    <div class="nav-item" id="nav-history" onclick="goP('history')"><i data-lucide="calendar"></i>歷史</div>
    <div class="nav-item" id="nav-chart" onclick="goP('chart')"><i data-lucide="bar-chart-3"></i>分析</div>
    <div class="nav-item" id="nav-settings" onclick="goP('settings')"><i data-lucide="settings"></i>設定</div>
  </nav>
  <button class="fab" onclick="openA()"><i data-lucide="plus"></i></button>
</div>

<!-- ════════ 新增/編輯 彈窗 ════════ -->
<div class="modal-overlay" id="modal-a">
  <div class="modal-sheet">
    <div class="modal-header">
      <button id="btn-del" class="del-btn" onclick="confirmDelete()" style="display:none;">刪除</button>
      <span id="modal-t" style="font-weight:800; color:var(--theme);">新增紀錄</span>
      <button class="close-btn" onclick="closeA()"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-fixed-top">
      <div style="display:flex; background:#F2F2F7; padding:4px; border-radius:12px; margin-bottom:10px;">
        <button id="t-exp" onclick="setTType('expense')" style="flex:1; padding:8px; border:none; border-radius:10px; font-weight:800; font-size:13px; font-family:inherit; cursor:pointer;">支出</button>
        <button id="t-inc" onclick="setTType('income')" style="flex:1; padding:8px; border:none; border-radius:10px; font-weight:800; font-size:13px; background:none; color:#AAA; font-family:inherit; cursor:pointer;">收入</button>
      </div>
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <button id="a-cash" onclick="setA('現金')" style="flex:1; padding:10px; border:1.5px solid #EEE; border-radius:12px; background:white; font-size:12px; font-weight:800; font-family:inherit; cursor:pointer;">現金</button>
        <button id="a-card" onclick="setA('信用卡')" style="flex:1; padding:10px; border:1.5px solid #EEE; border-radius:12px; background:white; font-size:12px; font-weight:800; font-family:inherit; cursor:pointer;">信用卡</button>
      </div>
      <div id="disp-amt" class="num-font" style="text-align:center; font-size:42px; color:var(--theme); padding:5px 0;">0</div>
      <div style="display:flex; gap:8px;">
        <!-- ✅ autocomplete=off 避免 iOS 建議干擾 -->
        <input type="text" id="n-input" placeholder="備註..." autocomplete="off" style="flex:1; padding:12px; background:#F2F2F7; border:none; border-radius:12px; outline:none; font-size:14px; font-weight:700; font-family:inherit;">
        <!-- ✅ date input 寬度改為彈性，避免 mini 上溢出 -->
        <input type="date" id="d-input" style="width:130px; padding:10px 8px; background:#F2F2F7; border:none; border-radius:12px; outline:none; font-size:11px; font-weight:700; font-family:inherit; color:var(--text);">
      </div>
    </div>
    <div class="modal-scroll-mid">
      <div class="cat-grid" id="cat-grid"></div>
    </div>
    <div class="modal-keyboard">
      <div class="k-grid" id="k-container"></div>
    </div>
  </div>
</div>

<!-- ════════ 日期紀錄 彈窗 ════════ -->
<div class="modal-overlay" id="modal-day">
  <div class="modal-sheet" style="max-height:65dvh;">
    <div class="modal-header">
      <span id="day-title" style="font-weight:800; color:var(--theme);">紀錄清單</span>
      <button class="close-btn" onclick="closeDay()"><i data-lucide="x"></i></button>
    </div>
    <div class="scroll-area" id="day-list" style="padding-bottom:20px;"></div>
  </div>
</div>

<!-- ✅ 自製刪除確認 Dialog（取代原生 confirm） -->
<div class="confirm-overlay" id="confirm-del">
  <div class="confirm-box">
    <h3>刪除這筆紀錄？</h3>
    <p>刪除後無法復原</p>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">取消</button>
      <button class="confirm-ok" onclick="doDelete()">確認刪除</button>
    </div>
  </div>
</div>

<!-- ✅ 儲存成功 Toast -->
<div id="toast" style="
  position:fixed; bottom:calc(160px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
  background:rgba(0,0,0,0.75); color:white; padding:10px 20px; border-radius:20px;
  font-size:13px; font-weight:800; z-index:500; opacity:0; transition:all 0.3s; pointer-events:none; white-space:nowrap;
"></div>

<script>
// ════════ 資料結構 ════════
const CATS = [
  {id:'food',  name:'飲食',  icon:'utensils'},
  {id:'bus',   name:'交通',  icon:'bus'},
  {id:'shop',  name:'購物',  icon:'shopping-bag'},
  {id:'home',  name:'日用',  icon:'home'},
  {id:'play',  name:'娛樂',  icon:'gamepad-2'},
  {id:'med',   name:'醫療',  icon:'stethoscope'},
  {id:'social',name:'社交',  icon:'glass-water'},
  {id:'gift',  name:'禮物',  icon:'gift'},
  {id:'phone', name:'通訊',  icon:'smartphone'},
  {id:'cloth', name:'服飾',  icon:'shirt'},
  {id:'tax',   name:'稅金',  icon:'banknote'},
  {id:'other', name:'其他',  icon:'more-horizontal'}
];

// ✅ 統一 LocalStorage key 名稱（修復讀寫 key 不一致的嚴重 bug）
const LS_RECS = 'zhien_v27_recs';
const LS_CFG  = 'zhien_v27_cfg';

// ✅ 讀取時做舊版 key 遷移，不讓舊資料消失
function migrateStorage() {
  const oldKeys = ['lzb_v27_recs', 'money_v27_recs'];
  for (const k of oldKeys) {
    const old = localStorage.getItem(k);
    if (old && !localStorage.getItem(LS_RECS)) {
      localStorage.setItem(LS_RECS, old);
      localStorage.removeItem(k);
      break;
    }
  }
  const oldCfg = localStorage.getItem('cfg_v27');
  if (oldCfg && !localStorage.getItem(LS_CFG)) {
    localStorage.setItem(LS_CFG, oldCfg);
    localStorage.removeItem('cfg_v27');
  }
}
migrateStorage();

let records = JSON.parse(localStorage.getItem(LS_RECS)) || [];
let config  = JSON.parse(localStorage.getItem(LS_CFG))  || { theme: "#c38ed5", balance: 0, name: "知恩", desc: "財富自由，指日可待", budget: 20000 };
let state   = { id: null, type: 'expense', acc: '現金', cat: 'food', amt: "" };
let charts  = { pie: null, trend: null };
let hY = new Date().getFullYear(), hM = new Date().getMonth() + 1;
let repY = new Date().getFullYear();

// ════════ 工具函式 ════════
const $ = id => document.getElementById(id);
const setT = (id, v) => { const el = $(id); if (el) el.innerText = v; };
const setV = (id, v) => { const el = $(id); if (el) el.value = v; };
const fmt  = n => '$' + Math.abs(Number(n)).toLocaleString('en');

function showToast(msg) {
  const t = $('toast');
  t.innerText = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 1800);
}

// ✅ generatePalette：接受任意顏色格式（hex 或 rgb string）
function generatePalette(base) {
  let r, g, b;
  if (base.startsWith('#')) {
    r = parseInt(base.slice(1,3), 16);
    g = parseInt(base.slice(3,5), 16);
    b = parseInt(base.slice(5,7), 16);
  } else {
    const m = base.match(/\d+/g) || [195, 142, 213];
    [r, g, b] = m.map(Number);
  }
  return [
    `rgba(${r},${g},${b},1)`,
    `rgba(${r},${g},${b},0.8)`,
    `rgba(${r},${g},${b},0.6)`,
    `rgba(${r},${g},${b},0.4)`,
    `rgba(${r},${g},${b},0.25)`,
    '#CCC'
  ];
}

// ✅ setTheme：統一用 rgba() 設定 --theme-light，修復舊版 iOS 不支援 hex+alpha
function setTheme(c) {
  config.theme = c;
  document.documentElement.style.setProperty('--theme', c);
  // 解析顏色並重建 rgba()
  let r = 195, g = 142, b = 213;
  if (c.startsWith('#') && c.length === 7) {
    r = parseInt(c.slice(1,3), 16);
    g = parseInt(c.slice(3,5), 16);
    b = parseInt(c.slice(5,7), 16);
  }
  document.documentElement.style.setProperty('--theme-light', `rgba(${r},${g},${b},0.15)`);
  // 動態更新 theme-dark（加深 15%）
  const darken = v => Math.max(0, v - 38);
  document.documentElement.style.setProperty('--theme-dark', `rgb(${darken(r)},${darken(g)},${darken(b)})`);
  renderHome();
  if ($('pg-chart').classList.contains('active')) renderChart();
}

// ✅ safeEval：修復多個小數點（如 1.2.3）導致 NaN 的問題
function safeEval(s) {
  let clean = s.replace(/[^0-9+.]/g, '');
  if (clean.endsWith('+')) clean = clean.slice(0, -1);
  try {
    const parts = clean.split('+');
    const result = parts.reduce((acc, curr) => {
      // 確保每個部分最多只有一個小數點
      const sanitized = curr.replace(/\.(?=.*\.)/g, '');
      return acc + (Number(sanitized) || 0);
    }, 0);
    return result;
  } catch(e) { return 0; }
}

// ════════ 頁面切換 ════════
function goP(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('pg-' + id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const nav = $('nav-' + id); if (nav) nav.classList.add('active');
  if (id === 'home')     renderHome();
  if (id === 'history')  renderHist();
  if (id === 'chart')    renderChart();
  if (id === 'settings') {
    setV('s-name', config.name);
    setV('s-desc', config.desc);
    setV('s-balance', config.balance);
    setV('s-budget', config.budget);
  }
}

// ════════ 首頁 ════════
function renderHome() {
  const today = new Date();
  const week = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  setT('h-date-str', `${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()} ${week[today.getDay()]}`);
  setT('h-name-disp', config.name + '手帳');
  setT('h-desc-disp', config.desc);

  const incSum = records.filter(r => r.type === 'income').reduce((a, b) => a + Number(b.amt), 0);
  const expSum = records.filter(r => r.type === 'expense').reduce((a, b) => a + Number(b.amt), 0);
  setT('h-balance', fmt(Number(config.balance) + incSum - expSum));

  const nowYM = today.toISOString().slice(0, 7);
  const mE = records.filter(r => r.date.startsWith(nowYM) && r.type === 'expense');
  setT('h-cash', fmt(mE.filter(r => r.acc === '現金').reduce((a, b) => a + Number(b.amt), 0)));
  setT('h-card', fmt(mE.filter(r => r.acc === '信用卡').reduce((a, b) => a + Number(b.amt), 0)));

  const totalM = mE.reduce((a, b) => a + Number(b.amt), 0);
  const pct = Math.min(100, Math.round((totalM / config.budget) * 100)) || 0;
  const fill = $('h-budget-fill'); if (fill) fill.style.width = pct + '%';
  setT('h-budget-pct', pct + '%');
  setT('h-budget-text', `剩餘 ${fmt(config.budget - totalM)} / ${fmt(config.budget)}`);

  // ✅ 用 spread 複製陣列再 sort，不污染原始 records
  const recent = [...records]
    .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id)
    .slice(0, 3);
  const listEl = $('h-list');
  listEl.innerHTML = recent.map(r => renderRow(r)).join('');
  // ✅ lucide.createIcons 傳入 scope，不全域掃描
  lucide.createIcons({ nodes: listEl.querySelectorAll('[data-lucide]') });
}

// ════════ 歷史頁 ════════
function changeHM(dir) {
  hM += dir;
  if (hM > 12) { hM = 1; hY++; }
  if (hM < 1)  { hM = 12; hY--; }
  renderHist();
}

function renderHist() {
  const ym = `${hY}-${String(hM).padStart(2,'0')}`;
  setT('hist-m-label', `${hY}年 ${hM}月`);
  const mRecs = records.filter(r => r.date.startsWith(ym));
  const e = mRecs.filter(r => r.type === 'expense').reduce((a, b) => a + Number(b.amt), 0);
  const i = mRecs.filter(r => r.type === 'income').reduce((a, b)  => a + Number(b.amt), 0);
  setT('hist-net-val', fmt(i - e));
  setT('hist-exp', fmt(e));
  setT('hist-inc', fmt(i));

  const fill = $('hist-net-fill');
  if (fill) fill.style.width = Math.min(100, Math.max(0, (e / config.budget) * 100)) + '%';

  // 月曆
  const days = new Date(hY, hM, 0).getDate();
  const first = new Date(hY, hM - 1, 1).getDay();
  const tStr = new Date().toISOString().slice(0, 10);
  let h = `<div class="cal-grid">`;
  ['日','一','二','三','四','五','六'].forEach(d => h += `<div class="cal-cell cal-head">${d}</div>`);
  for (let k = 0; k < first; k++) h += `<div class="cal-cell"></div>`;
  for (let d = 1; d <= days; d++) {
    const dS = `${hY}-${String(hM).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasDot = mRecs.some(r => r.date === dS);
    h += `<div class="cal-cell ${dS === tStr ? 'cal-today' : ''}" onclick="showDayList('${dS}')">${d}${hasDot ? '<div class="cal-dot"></div>' : ''}</div>`;
  }
  const calBox = $('hist-cal-box');
  calBox.innerHTML = h + `</div>`;

  // 列表：✅ spread + sort，不污染原陣列
  const histList = $('hist-list');
  histList.innerHTML = [...mRecs]
    .sort((a, b) => b.date.localeCompare(a.date))
    .map(r => renderRow(r, true)).join('');
  lucide.createIcons({ nodes: histList.querySelectorAll('[data-lucide]') });
}

function showDayList(date) {
  setT('day-title', date + ' 紀錄');
  const dayRecs = records.filter(r => r.date === date);
  const dl = $('day-list');
  dl.innerHTML = dayRecs.length
    ? dayRecs.map(r => renderRow(r, true)).join('')
    : '<div style="text-align:center;color:#CCC;padding:20px;">當天無紀錄</div>';
  $('modal-day').classList.add('open');
  lucide.createIcons({ nodes: dl.querySelectorAll('[data-lucide]') });
}
function closeDay() { $('modal-day').classList.remove('open'); }

// ════════ renderRow ════════
function renderRow(r, isH = false) {
  // ✅ CATS.find null guard：找不到分類時 fallback 到 other
  const c = CATS.find(x => x.id === r.cat) || CATS[CATS.length - 1];
  return `<div class="list-item" onclick="openE(${r.id})">
    <div style="background:var(--theme-light);color:var(--theme);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <i data-lucide="${c.icon}" style="width:18px;height:18px;"></i>
    </div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.note}</div>
      <div style="font-size:10px;color:#AAA;">${r.date} | ${r.acc}</div>
    </div>
    <div style="font-weight:800;font-size:16px;color:${r.type==='expense'?'#ff6b6b':'#4ecb71'};flex-shrink:0;" class="num-font">${r.type==='expense'?'-':'+'}${fmt(r.amt)}</div>
  </div>`;
}

// ════════ 分析頁 ════════
function renderChart() {
  const curY = new Date().getFullYear(), curM = new Date().getMonth() + 1;
  const ySet = [...new Set(records.map(r => parseInt(r.date.slice(0,4))))];
  if (!ySet.includes(curY)) ySet.push(curY);
  ySet.sort((a, b) => b - a);

  const ySel = $('c-year-sel');
  if (ySel) {
    ySel.innerHTML = ySet.map(y =>
      `<button class="k-btn" style="padding:0 15px;font-size:12px;flex-shrink:0;background:${y===repY?'var(--theme)':'#EEE'};color:${y===repY?'white':'#AAA'}" onclick="repY=${y};renderChart();">${y}</button>`
    ).join('');
  }

  const targetYM = `${repY}-${String(curM).padStart(2,'0')}`;
  const mExp = records.filter(r => r.date.startsWith(targetYM) && r.type === 'expense');
  const dataM = {};
  mExp.forEach(r => { dataM[r.cat] = (dataM[r.cat] || 0) + Number(r.amt); });
  const tE = Object.values(dataM).reduce((a, b) => a + b, 0);
  setT('c-pie-m', curM + '月');
  setT('c-total-v', fmt(tE));

  // ✅ 銷毀前確認 chart 存在
  if (charts.pie) { charts.pie.destroy(); charts.pie = null; }
  const pc = $('chart-pie');
  if (pc) {
    // ✅ CATS.find null guard：過濾掉找不到的分類
    const validEntries = Object.entries(dataM).filter(([id]) => CATS.find(x => x.id === id));
    charts.pie = new Chart(pc, {
      type: 'doughnut',
      data: {
        labels: validEntries.map(([id]) => CATS.find(x => x.id === id).name),
        datasets: [{
          data: validEntries.length ? validEntries.map(([,v]) => v) : [1],
          backgroundColor: generatePalette(config.theme),
          borderWidth: 0
        }]
      },
      options: { cutout: '78%', plugins: { legend: { display: false } } }
    });
  }

  const rank = $('c-rank');
  if (rank) {
    const sorted = Object.entries(dataM)
      .filter(([id]) => CATS.find(x => x.id === id))
      .sort((a, b) => b[1] - a[1]);
    rank.innerHTML = sorted.map(([id, v]) =>
      `<div class="list-item" style="padding:12px 18px;">
        <div style="flex:1;font-weight:700;">${CATS.find(x=>x.id===id).name} <span style="font-size:10px;color:#BBB;">${tE ? Math.round(v/tE*100) : 0}%</span></div>
        <div style="font-weight:800;color:var(--theme);" class="num-font">${fmt(v)}</div>
      </div>`
    ).join('');
  }

  // 年度月報
  let repH = '', annualNetTotal = 0, trendD = [], trendL = [];
  for (let m = 12; m >= 1; m--) {
    if (repY === curY && m > curM) continue;
    const ym = `${repY}-${String(m).padStart(2,'0')}`;
    const rcs = records.filter(r => r.date.startsWith(ym));
    const me = rcs.filter(r => r.type === 'expense').reduce((a, b) => a + Number(b.amt), 0);
    const mi = rcs.filter(r => r.type === 'income').reduce((a, b) => a + Number(b.amt), 0);
    const netM = mi - me;
    annualNetTotal += netM;
    trendD.push(me);
    trendL.push(m + '月');
    repH += `<div class="report-card">
      <div style="font-weight:800;font-size:14px;">${repY}/${String(m).padStart(2,'0')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;">
        <div><div style="font-size:10px;color:#AAA;">支出</div><div style="font-size:13px;font-weight:700;">${fmt(me)}</div></div>
        <div><div style="font-size:10px;color:#AAA;">收入</div><div style="font-size:13px;font-weight:700;">${fmt(mi)}</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px dashed #EEE;">
        <span style="font-size:11px;color:#999;">結餘</span>
        <b style="color:${netM>=0?'#4ECB71':'#FF6B6B'}" class="num-font">${fmt(netM)}</b>
      </div>
    </div>`;
  }
  const mList = $('c-monthly-list'); if (mList) mList.innerHTML = repH;
  setT('c-annual-net', `${repY} 年度總結餘: ${fmt(annualNetTotal)}`);

  if (charts.trend) { charts.trend.destroy(); charts.trend = null; }
  const tc = $('chart-trend');
  if (tc) {
    charts.trend = new Chart(tc, {
      type: 'line',
      data: {
        labels: trendL.reverse(),
        datasets: [{
          data: trendD.reverse(),
          borderColor: config.theme,
          tension: 0.4,
          borderWidth: 3,
          fill: true,
          backgroundColor: config.theme + '22'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { display: true, grid: { color: '#F0F0F0' } },
          x: { grid: { display: false } }
        }
      }
    });
  }
}

// ════════ 新增 / 編輯 彈窗 ════════
function openA() {
  state = { id: null, type: 'expense', acc: '現金', cat: 'food', amt: "" };
  setT('modal-t', '新增紀錄');
  const d = $('btn-del'); if (d) d.style.display = 'none';
  setV('n-input', '');
  setV('d-input', new Date().toISOString().slice(0, 10));
  syncU();
  $('modal-a').classList.add('open');
}

function openE(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  closeDay();
  state = { id, type: r.type, acc: r.acc, cat: r.cat, amt: r.amt.toString() };
  setT('modal-t', '編輯紀錄');
  const d = $('btn-del'); if (d) d.style.display = 'block';
  setV('n-input', r.note);
  setV('d-input', r.date);
  syncU();
  $('modal-a').classList.add('open');
}

function syncU() {
  setT('disp-amt', state.amt || '0');
  setTType(state.type);
  setA(state.acc);
  const grid = $('cat-grid');
  if (grid) {
    grid.innerHTML = CATS.map(c =>
      `<button class="cat-btn ${state.cat === c.id ? 'active' : ''}" onclick="state.cat='${c.id}';syncU();">
        <div class="cat-sq"><i data-lucide="${c.icon}" style="width:24px;height:24px;"></i></div>
        <div class="cat-txt">${c.name}</div>
      </button>`
    ).join('');
    lucide.createIcons({ nodes: grid.querySelectorAll('[data-lucide]') });
  }
}

function setTType(t) {
  state.type = t;
  const e = $('t-exp'), i = $('t-inc');
  if (e) { e.style.background = t === 'expense' ? 'white' : 'none'; e.style.color = t === 'expense' ? 'var(--theme)' : '#AAA'; }
  if (i) { i.style.background = t === 'income'  ? 'white' : 'none'; i.style.color = t === 'income'  ? 'var(--theme)' : '#AAA'; }
}

function setA(a) {
  state.acc = a;
  const c = $('a-cash'), d = $('a-card');
  if (c) c.style.borderColor = a === '現金' ? 'var(--theme)' : '#EEE';
  if (d) d.style.borderColor = a === '信用卡' ? 'var(--theme)' : '#EEE';
}

// ════════ 數字鍵盤 ════════
function p(v) {
  $('n-input').blur(); // 收起系統鍵盤
  if (v === 'del') {
    state.amt = state.amt.slice(0, -1);
  } else if (state.amt.length < 10) {
    // ✅ 加號只允許出現一次
    if (v === '+' && (state.amt.length === 0 || state.amt.endsWith('+') || state.amt.includes('+'))) return;
    // ✅ 小數點：每個加號區段只允許一個
    if (v === '.') {
      const lastSegment = state.amt.split('+').pop();
      if (lastSegment.includes('.')) return;
    }
    state.amt += v;
  }
  setT('disp-amt', state.amt || '0');
}

function closeA() { $('modal-a').classList.remove('open'); }

function saveR() {
  if (!state.amt) return;
  const finalVal = safeEval(state.amt);
  if (finalVal <= 0) return;
  const note = $('n-input').value.trim();
  const cat  = CATS.find(x => x.id === state.cat) || CATS[CATS.length - 1];
  const d = {
    id:   state.id || Date.now(),
    amt:  finalVal,
    type: state.type,
    acc:  state.acc,
    cat:  state.cat,
    note: note || cat.name,
    date: $('d-input').value
  };
  if (state.id) {
    records = records.map(r => r.id === state.id ? d : r);
  } else {
    records.push(d);
  }
  // ✅ 統一使用正確的 key 儲存
  localStorage.setItem(LS_RECS, JSON.stringify(records));
  closeA();
  renderHome();
  showToast('✓ 已儲存');
}

// ════════ 刪除確認（自製 Dialog）════════
function confirmDelete() {
  $('confirm-del').classList.add('open');
}
function closeConfirm() {
  $('confirm-del').classList.remove('open');
}
function doDelete() {
  records = records.filter(r => r.id !== state.id);
  localStorage.setItem(LS_RECS, JSON.stringify(records));
  closeConfirm();
  closeA();
  renderHome();
  if ($('pg-history').classList.contains('active')) renderHist();
  showToast('已刪除');
}

// ════════ 設定 ════════
function saveS() {
  config.name    = $('s-name').value    || '知恩';
  config.desc    = $('s-desc').value    || '財富自由';
  config.balance = Number($('s-balance').value) || 0;
  config.budget  = Number($('s-budget').value)  || 20000;
  localStorage.setItem(LS_CFG, JSON.stringify(config));
  setTheme(config.theme);
  showToast('✓ 設定已儲存');
}

// ════════ 資料匯出/匯入 ════════
function exportData() {
  const data = { records, config, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `知恩手帳備份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.records) {
        records = data.records;
        localStorage.setItem(LS_RECS, JSON.stringify(records));
      }
      if (data.config) {
        config = data.config;
        localStorage.setItem(LS_CFG, JSON.stringify(config));
      }
      setTheme(config.theme);
      renderHome();
      showToast('✓ 匯入成功');
    } catch {
      showToast('❌ 檔案格式錯誤');
    }
  };
  reader.readAsText(file);
  event.target.value = ''; // 清除，允許重複匯入同一檔案
}

// ════════ 鍵盤渲染 ════════
function renderKeyboard() {
  const keys = ['7','8','9','del','4','5','6','+','1','2','3','ok','0','.'];
  const container = $('k-container');
  container.innerHTML = keys.map(k => {
    if (k === 'ok')  return `<button onclick="saveR()" class="k-ok">OK</button>`;
    if (k === 'del') return `<button class="k-btn" onclick="p('del')"><i data-lucide="delete" style="width:20px;margin:auto;display:block;"></i></button>`;
    return `<button class="k-btn" onclick="p('${k}')" ${k==='0'?'style="grid-column:span 2"':''}>${k}</button>`;
  }).join('');
  lucide.createIcons({ nodes: container.querySelectorAll('[data-lucide]') });
}

// ════════ Service Worker 註冊 ════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ════════ 初始化 ════════
window.onload = () => {
  setTheme(config.theme);
  renderKeyboard();
  renderHome();
  // Header icons（首頁 banknote icon）
  lucide.createIcons();
};
</script>
